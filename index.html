<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Balon Durağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Yön: güneşli bir orman patikası, çıkartma gibi kalın çizgili ve bol renkli bir çizgi film dünyası. Tek tema (gündüz). */
:root {
  color-scheme: light;
  --sky-1: #4fc3ff; --sky-2: #c9f2ff;
  --ink: #2a1a5e;         /* kontur ve yazı: koyu çivit */
  --ink-dim: #5a4b94;
  --paper: #ffffff;
  --paper-2: #ece6ff;
  --board: #3a2b8c; --board-2: #43349c;   /* tahta zemini (damalı) */
  --accent: #ff4f8b;      /* açık durak, uyarı */
  --gold: #ffc61a;
  --go: #3ddc84;          /* ana düğme */
  --font-display: "Baloo 2", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  --font-body: "Nunito", "Segoe UI", Roboto, Arial, sans-serif;
  --c0: #ff4d5e; --c0d: #c2203a; --c0l: #ff9aa4;   /* kırmızı */
  --c1: #ffc93c; --c1d: #d28f00; --c1l: #ffe69a;   /* sarı */
  --c2: #37d48f; --c2d: #0f9a60; --c2l: #a4f2cd;   /* yeşil */
  --c3: #4aa8ff; --c3d: #1b6fd0; --c3l: #b0d8ff;   /* mavi */
  --c4: #b57bff; --c4d: #7b3fd6; --c4l: #dcc2ff;   /* mor */
  --c5: #ff7ac8; --c5d: #d23f95; --c5l: #ffc4e6;   /* pembe */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: linear-gradient(var(--sky-1), var(--sky-2)) fixed; color: var(--ink);
  font-family: var(--font-body); font-weight: 700; font-size: 16px;
  overflow: hidden; touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, .node:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.screen { height: 100%; max-width: 480px; margin: 0 auto; display: none; flex-direction: column; position: relative; }
.screen.on { display: flex; }
.sticker { border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }

/* ---------- Harita ---------- */
.map-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 12px; background: var(--paper); z-index: 2; border-bottom: 3px solid var(--ink); }
.map-head h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; color: var(--accent); text-shadow: 0 2px 0 var(--ink); }
.map-head p { margin: 5px 0 0; color: var(--ink-dim); font-size: 13px; }
.counts { margin-left: auto; display: flex; gap: 8px; }
.count { background: var(--ink); color: #fff; border-radius: 999px; padding: 5px 12px; font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.count.star { color: var(--gold); }
.count.coin::before { content: ""; display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: radial-gradient(circle at 35% 30%, #fff3b8, var(--gold) 55%, #c98f00); }
#mapScroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; background: #49bd50; -webkit-overflow-scrolling: touch; }
#mapSvg { display: block; width: 100%; height: auto; }
.node { cursor: pointer; }
.node.locked { cursor: default; }
.n-top, .n-side { stroke: var(--ink); stroke-width: 3; }
.n-top { fill: #c3cde0; } .n-side { fill: #8c99b3; }
.node.open .n-top { fill: var(--accent); } .node.open .n-side { fill: #c42463; }
.node.done .n-top { fill: var(--go); } .node.done .n-side { fill: #1e9e57; }
.node.gold .n-top { fill: var(--gold); } .node.gold .n-side { fill: #c98f00; }
.n-no { font-family: "Baloo 2", "Trebuchet MS", sans-serif; font-weight: 800; font-size: 24px; fill: #fff; text-anchor: middle; stroke: var(--ink); stroke-width: 3; paint-order: stroke fill; }
.node.locked .n-no { fill: #eef2f8; }
.n-stars { font-size: 17px; text-anchor: middle; fill: var(--gold); letter-spacing: 1px; stroke: var(--ink); stroke-width: 3; paint-order: stroke fill; }
.n-plate { fill: #fff; stroke: var(--ink); stroke-width: 2.5; }
.n-name { font-family: "Baloo 2", "Trebuchet MS", sans-serif; font-weight: 700; font-size: 15px; fill: var(--ink); }
.node.locked .n-name { fill: #8a84a8; }
.node.open .n-top { animation: beat 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes beat { to { transform: scale(1.08); } }
#marker .bob { animation: bob 1.5s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-7px); } }
.fly { animation: twinkle 2.4s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: 0.1; } to { opacity: 0.9; } }

/* ---------- Durak kartı ve bölüm sonu ---------- */
.overlay { position: fixed; inset: 0; background: rgba(42, 26, 94, 0.62); display: none; place-items: center; padding: 16px; z-index: 10; overflow: hidden; }
.overlay.on { display: grid; }
.card { position: relative; width: 100%; max-width: 360px; background: var(--paper); border: 4px solid var(--ink); border-radius: 26px; padding: 22px 20px 22px; text-align: center; box-shadow: 0 9px 0 var(--ink); animation: cardIn 0.32s cubic-bezier(0.2, 1.4, 0.4, 1); }
@keyframes cardIn { from { transform: translateY(30px) scale(0.92); opacity: 0; } }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.05; text-wrap: balance; }
.card p { margin: 8px 0 0; color: var(--ink-dim); }
.glyph { width: 78px; height: 78px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; font-size: 42px; line-height: 1; background: #ffe45c; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.close { position: absolute; right: 10px; top: 10px; width: 40px; height: 40px; border-radius: 50%; background: var(--paper-2); border: 3px solid var(--ink); font-size: 20px; line-height: 1; font-weight: 800; }
.big-stars { font-size: 46px; letter-spacing: 6px; color: var(--gold); margin: 10px 0 2px; line-height: 1; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.big-stars span { display: inline-block; animation: starIn 0.45s cubic-bezier(0.2, 1.8, 0.4, 1) backwards; }
.big-stars i { font-style: normal; color: var(--paper-2); }
@keyframes starIn { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
.medal { width: 92px; height: 92px; margin: 6px auto 8px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #5a3d00; background: radial-gradient(circle at 35% 28%, #fff6c9, var(--gold) 50%, #e0a000); border: 4px solid var(--ink); box-shadow: 0 5px 0 var(--ink); animation: starIn 0.5s cubic-bezier(0.2, 1.8, 0.4, 1) backwards; }
.actions { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.btn { border-radius: 16px; padding: 11px 14px; font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.15; color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); transition: transform 0.08s, box-shadow 0.08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn small { display: block; font-family: var(--font-body); font-weight: 800; font-size: 13px; opacity: 0.75; }
.btn.primary { background: var(--go); }
.btn.goldb { background: var(--gold); }
.btn.ghost { background: var(--paper-2); }
.btn:disabled { opacity: 0.55; cursor: default; }
.floaty { position: absolute; bottom: -80px; width: 46px; height: 46px; animation: rise linear forwards; pointer-events: none; }
@keyframes rise { to { transform: translateY(-120vh) rotate(12deg); } }

/* ---------- Oyun ---------- */
#game { padding: 10px 12px 10px; gap: 9px; }
.top { display: flex; align-items: center; gap: 10px; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-size: 20px; font-weight: 800; line-height: 1; flex: none; }
.station { flex: 1; min-width: 0; }
.station b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 23px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station span { font-size: 12px; font-weight: 800; color: var(--ink-dim); }
.station span.hard { color: #fff; background: var(--ink); border-radius: 999px; padding: 1px 8px; }
.moves { background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); border-radius: 14px; padding: 1px 10px 3px; text-align: center; min-width: 70px; }
.moves b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.moves span { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; }
.moves.low { background: var(--accent); color: #fff; animation: beat 0.5s ease-in-out infinite alternate; }
.goals { display: flex; gap: 8px; flex-wrap: wrap; min-height: 44px; }
.goal { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); border-radius: 999px; padding: 3px 14px 3px 5px; font-family: var(--font-display); font-weight: 800; font-size: 23px; line-height: 1; font-variant-numeric: tabular-nums; }
.goal .mini { width: 28px; height: 28px; position: relative; flex: none; }
.goal.ok { background: var(--go); }
.goal.bump { animation: bump 0.28s; }
@keyframes bump { 40% { transform: scale(1.18); } }

#boardWrap { flex: 1; min-height: 0; display: grid; place-items: center; }
#board { position: relative; background: repeating-conic-gradient(var(--board-2) 0 25%, var(--board) 0 50%) 0 0 / calc(var(--cell) * 2) calc(var(--cell) * 2); border-radius: 18px; outline: 4px solid var(--ink); box-shadow: 0 8px 0 var(--ink); overflow: hidden; touch-action: none; }
#board.shake { animation: shake 0.32s; }
@keyframes shake { 20% { transform: translate(-5px, 3px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-3px, -2px); } 80% { transform: translate(3px, 2px); } }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.tile { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); transition: transform 0.18s cubic-bezier(0.3, 0.1, 0.3, 1); will-change: transform; }
.tile.now { transition: none !important; }
.tile.lift { z-index: 3; }
.tile.merge { transition: transform 0.2s cubic-bezier(0.5, 0, 0.9, 0.5); z-index: 2; }
.inner { position: absolute; inset: 7%; transition: transform 0.15s ease-out, opacity 0.15s ease-out, filter 0.15s; }
.tile.lift .inner { transform: scale(1.14); }
.tile.merge .inner { transform: scale(0.35); opacity: 0; transition-duration: 0.2s; }
.tile.pop .inner { animation: popOut 0.22s ease-out forwards; }
@keyframes popOut { 35% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.15); opacity: 0; } }
.tile.born { z-index: 2; }
.tile.born .inner { animation: born 0.42s cubic-bezier(0.2, 1.8, 0.4, 1); }
@keyframes born { from { transform: scale(0) rotate(-90deg); } }
.tile.land .inner { animation: land 0.22s ease-out; }
@keyframes land { 0% { transform: translateY(5%) scale(1.12, 0.84); } 55% { transform: translateY(-3%) scale(0.95, 1.06); } }
.tile.nope .inner { animation: nope 0.24s; }
@keyframes nope { 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
.tile.sel { z-index: 2; }
.tile.sel .inner { transform: scale(1.16); filter: drop-shadow(0 0 7px #fff); }
.tile.hint .inner { animation: hint 0.6s ease-in-out infinite alternate; }
@keyframes hint { to { transform: translate(var(--hx, 0), var(--hy, 0)) scale(1.08); } }

/* balon */
.b { border-radius: 50% 50% 50% 50% / 46% 46% 54% 54%; background: radial-gradient(circle at 33% 27%, rgba(255,255,255,0.9) 0 7%, rgba(255,255,255,0) 8%), radial-gradient(circle at 36% 30%, var(--l) 0%, var(--m) 48%, var(--d) 100%); }
.b::after { content: ""; position: absolute; left: 50%; bottom: -6%; width: 16%; height: 10%; transform: translateX(-50%); background: var(--d); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.b::before { /* renk körlüğü için şekil */ position: absolute; inset: 0; display: grid; place-items: center; padding-top: 14%; color: rgba(0,0,0,0.26); font-size: calc(var(--cell) * 0.3); line-height: 1; }
.c0 { --m: var(--c0); --d: var(--c0d); --l: var(--c0l); } .c0.b::before { content: "●"; }
.c1 { --m: var(--c1); --d: var(--c1d); --l: var(--c1l); } .c1.b::before { content: "▲"; }
.c2 { --m: var(--c2); --d: var(--c2d); --l: var(--c2l); } .c2.b::before { content: "■"; }
.c3 { --m: var(--c3); --d: var(--c3d); --l: var(--c3l); } .c3.b::before { content: "◆"; }
.c4 { --m: var(--c4); --d: var(--c4d); --l: var(--c4l); } .c4.b::before { content: "★"; }
.c5 { --m: var(--c5); --d: var(--c5d); --l: var(--c5l); } .c5.b::before { content: "♥"; }

/* özel taşlar */
.sp { border-radius: 26%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: calc(var(--cell) * 0.5); line-height: 1; color: var(--ink); box-shadow: 0 0 0 2px rgba(255,255,255,0.9) inset, 0 0 0 2.5px var(--ink), 0 0 14px rgba(255, 230, 120, 0.8); }
.sp::after { content: ""; position: absolute; inset: -8%; border-radius: inherit; border: 2px solid rgba(255, 255, 255, 0.55); animation: halo 1.3s ease-out infinite; }
@keyframes halo { from { transform: scale(0.85); opacity: 0.9; } to { transform: scale(1.22); opacity: 0; } }
.rocketH, .rocketV, .rocketX { background: linear-gradient(135deg, #fff3b8, var(--gold) 55%, #f29a1f); }
.rocketH::before { content: "↔"; } .rocketV::before { content: "↕"; } .rocketX::before { content: "✚"; }
.bomb { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7d6bd6, #1d1248 70%); color: var(--gold); }
.bomb::before { content: "✹"; }
.rainbow { border-radius: 50%; background: conic-gradient(var(--c0), var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c0)); animation: spin 3s linear infinite; }
.rainbow::before { content: ""; width: 40%; height: 40%; border-radius: 50%; background: #fff; }
@keyframes spin { to { rotate: 360deg; } }
.crate { border-radius: 14%; background: repeating-linear-gradient(90deg, #b9793d 0 30%, #a56a31 30% 33.3%); box-shadow: inset 0 0 0 3px #7c4c1f, inset 0 0 0 6px #c98a4b; }
.crate::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top right, transparent 46%, #7c4c1f 46% 54%, transparent 54%); border-radius: 14%; }

/* ---------- Piksel kediler, elmas, dükkân ---------- */
.pix { image-rendering: pixelated; background-repeat: no-repeat; background-size: 100% 100%; background-position: center; }
.count { border: 0; }
.count.dia { cursor: pointer; }
.count.dia[hidden] { display: none; }
.count.dia::before, .gem::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 7px; vertical-align: 0; transform: rotate(45deg); background: linear-gradient(135deg, #b8f6ff, #32c8ff 55%, #1479d6); border: 1.5px solid #fff; }
.map-head { flex-wrap: wrap; row-gap: 6px; }
#shopList { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; text-align: left; }
.shop-row { display: flex; align-items: center; gap: 10px; background: var(--paper-2); border: 3px solid var(--ink); border-radius: 16px; padding: 8px 10px; }
.shop-row .pix { width: 52px; height: 52px; flex: none; }
.shop-row div { flex: 1; min-width: 0; }
.shop-row b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.1; }
.shop-row small { display: block; font-size: 12px; line-height: 1.25; color: var(--ink-dim); }
.shop-row .btn { flex: none; font-size: 16px; padding: 7px 10px; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; }
#endGain { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--ink); margin-top: 6px; }
#endGain:empty { display: none; }
#catbar { display: flex; justify-content: center; gap: 12px; flex: none; }
#catbar[hidden] { display: none; }
.catbtn { position: relative; width: 58px; height: 54px; border-radius: 16px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); padding: 3px; }
.catbtn .pix { display: block; width: 100%; height: 100%; }
.catbtn em { position: absolute; right: -7px; top: -7px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--ink); color: #fff; font-style: normal; font-family: var(--font-display); font-weight: 800; font-size: 14px; line-height: 22px; text-align: center; padding: 0 5px; }
.catbtn.empty .pix { opacity: 0.4; filter: grayscale(1); }
.catbtn.aim { background: var(--gold); transform: translateY(-5px); box-shadow: 0 8px 0 var(--ink); }
.cat-run { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); z-index: 7; pointer-events: none; transition: transform 0.3s linear; }
.cat-run .pix { display: block; width: 130%; height: 130%; margin: -15%; }
.cat-run .pix.jump { animation: jump 0.3s; }
@keyframes jump { 0% { transform: translateY(0) scale(1.1, 0.85); } 45% { transform: translateY(-85%) scale(0.92, 1.12); } 100% { transform: translateY(0) scale(1.15, 0.85); } }
.catbtn:disabled { opacity: 0.35; }
.catbtn.pulse { background: var(--gold); animation: catPulse 0.7s ease-in-out infinite alternate; }
@keyframes catPulse { to { transform: translateY(-7px) scale(1.12); box-shadow: 0 10px 0 var(--ink), 0 0 0 6px rgba(255, 198, 26, 0.45); } }
.tile.pick { z-index: 3; }
.tile.pick .inner { animation: pick 0.55s ease-in-out infinite alternate; }
@keyframes pick { from { transform: scale(1); filter: drop-shadow(0 0 0 #fff); } to { transform: scale(1.25); filter: drop-shadow(0 0 10px #fff) brightness(1.25); } }
.cutin { position: absolute; left: -10%; right: -10%; top: 32%; height: calc(var(--cell) * 2.3); z-index: 8; display: flex; align-items: center; justify-content: center; gap: 14px; background: var(--gold); border-top: 4px solid var(--ink); border-bottom: 4px solid var(--ink); transform: rotate(-4deg); animation: cutin 0.95s cubic-bezier(0.2, 0.9, 0.3, 1) both; pointer-events: none; }
.cutin .pix { width: calc(var(--cell) * 2); height: calc(var(--cell) * 2); flex: none; }
.cutin b { font-family: var(--font-display); font-weight: 800; font-size: calc(var(--cell) * 0.95); line-height: 1; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; letter-spacing: 1px; }
@keyframes cutin { 0% { transform: translateX(-120%) rotate(-4deg); } 22%, 72% { transform: translateX(0) rotate(-4deg); } 100% { transform: translateX(120%) rotate(-4deg); } }
.shade { position: absolute; inset: 0; z-index: 4; background: rgba(16, 8, 44, 0.72); animation: shadeIn 0.25s both; pointer-events: none; }
.shade.out { animation: shadeOut 0.3s both; }
@keyframes shadeIn { from { opacity: 0; } } @keyframes shadeOut { to { opacity: 0; } }
.screen.shake { animation: bigshake 0.45s; }
@keyframes bigshake { 10% { transform: translate(-8px, 5px) rotate(-0.6deg); } 25% { transform: translate(8px, -6px) rotate(0.6deg); } 40% { transform: translate(-7px, -4px); } 55% { transform: translate(6px, 5px); } 70% { transform: translate(-4px, 2px); } 85% { transform: translate(3px, -2px); } }

#coach { display: none; position: absolute; right: 10px; top: 92px; z-index: 3; max-width: 250px; text-align: left; background: var(--gold); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 10px 12px; font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.15; animation: coach 0.7s ease-in-out infinite alternate; }
#coach.on { display: block; }
#coach::before { content: ""; position: absolute; right: 26px; top: -11px; width: 16px; height: 16px; background: inherit; border-left: 3px solid var(--ink); border-top: 3px solid var(--ink); transform: rotate(45deg); }
@keyframes coach { to { transform: translateY(5px); } }
.count.dia.pulse { animation: beat 0.5s ease-in-out infinite alternate; box-shadow: 0 0 0 4px var(--gold); }

#wheelFab { position: absolute; right: 12px; bottom: 16px; z-index: 3; width: 66px; height: 74px; border-radius: 20px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px 0 2px; }
#wheelFab svg { width: 40px; height: 40px; }
#wheelFab b { font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1; }
#wheelFab.ready { background: var(--gold); animation: beat 0.8s ease-in-out infinite alternate; }
#wheelFab.ready .fab-rot { animation: spin 4s linear infinite; transform-origin: 0 0; }
#wheelFab:not(.ready) { opacity: 0.85; }
#wheelBox { width: 100%; max-width: 280px; margin: 8px auto 0; }
.wheel-svg { display: block; width: 100%; height: auto; overflow: visible; }
#wheelRot { transform-origin: 0 0; }
.wheel-num { font-family: "Baloo 2", "Trebuchet MS", sans-serif; font-weight: 800; font-size: 22px; fill: #fff; stroke: #2a1a5e; stroke-width: 4px; paint-order: stroke fill; text-anchor: middle; }
#wheelResult { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--ink); min-height: 1.3em; }
.odds { margin-top: 12px; font-size: 12.5px; color: var(--ink-dim); text-align: left; }
.odds summary { cursor: pointer; font-weight: 800; text-align: center; }
#wheelOdds { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; margin-top: 6px; }
.lv-zodiac { display: block; font-weight: 800; color: var(--accent); margin-bottom: 2px; }
.cat-title { display: block; font-style: normal; font-weight: 800; color: var(--accent); }
.cutin b small { display: block; font-size: 0.42em; -webkit-text-stroke: 3px var(--ink); letter-spacing: 0.5px; }
.bfly { animation: flap 0.35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes flap { to { transform: scaleX(0.35) translateY(-3px); } }

/* yeni engeller */
.ice { border-radius: 16%; background: linear-gradient(135deg, #f2fdff, #a9e8ff 55%, #6cc6f0); box-shadow: inset 0 0 0 3px var(--ink), inset 5px 5px 0 2px rgba(255, 255, 255, 0.75); }
.ice.cracked { background: linear-gradient(135deg, transparent 47%, var(--ink) 47%, var(--ink) 51%, transparent 51%), linear-gradient(60deg, transparent 58%, var(--ink) 58%, var(--ink) 61%, transparent 61%), linear-gradient(135deg, #e6f8ff, #9fdcf5 55%, #74bfe2); }
.kitten { border-radius: 50%; background-color: rgba(214, 244, 255, 0.55); background-repeat: no-repeat; background-size: 82%; background-position: center 62%; image-rendering: pixelated; box-shadow: inset 0 0 0 2.5px var(--ink), inset -4px -6px 0 rgba(255, 255, 255, 0.5); }
.tile.locked::after { content: ""; position: absolute; inset: 9%; z-index: 2; pointer-events: none; border-radius: 30%; background: linear-gradient(45deg, transparent 41%, #2a1a5e 41%, #2a1a5e 44%, #c3c8da 44%, #c3c8da 52%, #2a1a5e 52%, #2a1a5e 55%, transparent 55%), linear-gradient(-45deg, transparent 41%, #2a1a5e 41%, #2a1a5e 44%, #c3c8da 44%, #c3c8da 52%, #2a1a5e 52%, #2a1a5e 55%, transparent 55%); }
.lockmini { position: absolute; inset: 9%; border-radius: 30%; background: linear-gradient(45deg, transparent 41%, #2a1a5e 41%, #2a1a5e 44%, #c3c8da 44%, #c3c8da 52%, #2a1a5e 52%, #2a1a5e 55%, transparent 55%), linear-gradient(-45deg, transparent 41%, #2a1a5e 41%, #2a1a5e 44%, #c3c8da 44%, #c3c8da 52%, #2a1a5e 52%, #2a1a5e 55%, transparent 55%); }
.goal .mini .inner, .ed-ic .inner, .ed-cell .inner { position: absolute; inset: 7%; }
.tile.saved { transition: transform 0.6s ease-in, opacity 0.6s; z-index: 6; }
.tile.saved .inner { animation: saved 0.65s ease-in forwards; }
@keyframes saved { 40% { transform: scale(1.3); } 100% { transform: translateY(-160%) scale(0.6); opacity: 0; } }

/* editör */
#editor { padding: 10px 12px 12px; gap: 8px; background: var(--paper); }
.ed-top { display: flex; align-items: center; gap: 10px; }
.ed-top b { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.05; flex: 1; }
.ed-top select, .ed-goal select, .ed-row input, .ed-goal input, #edCode { font: inherit; font-size: 14px; color: var(--ink); background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: 10px; padding: 5px 6px; }
.ed-top select { max-width: 46%; }
.ed-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
.ed-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ed-row label { display: flex; align-items: center; gap: 6px; font-weight: 800; }
.ed-row input { width: 64px; }
.ed-small { font-size: 16px; padding: 7px 10px; box-shadow: 0 3px 0 var(--ink); }
#edTools { display: flex; gap: 6px; flex-wrap: wrap; }
.ed-tool { display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper-2); font-weight: 800; font-size: 13px; }
.ed-tool.on { background: var(--gold); }
.ed-ic { position: relative; display: block; width: 26px; height: 26px; }
#edGrid { display: grid; grid-template-columns: repeat(7, 38px); gap: 3px; justify-content: center; padding: 6px; background: var(--board); border-radius: 14px; border: 3px solid var(--ink); align-self: center; touch-action: none; }
.ed-cell { position: relative; width: 38px; height: 38px; border-radius: 8px; background: rgba(255, 255, 255, 0.08); cursor: pointer; }
.ed-cell * { pointer-events: none; }
.ed-void { position: absolute; inset: 0; border-radius: 8px; background: var(--paper); }
.ed-dot { position: absolute; inset: 38%; border-radius: 50%; background: rgba(255, 255, 255, 0.35); }
.ed-head { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
#edGoals { display: flex; flex-direction: column; gap: 6px; }
.ed-goal { display: flex; gap: 6px; align-items: center; }
.ed-goal input { width: 58px; }
.g-del { width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper-2); font-weight: 800; }
#edStatus { margin: 0; font-weight: 800; color: var(--ink-dim); }
#edCode { width: 100%; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; user-select: text; -webkit-user-select: text; }

/* puan barı */
.scorebar { display: flex; align-items: center; gap: 12px; padding: 2px 4px 0 2px; }
.scorebar[hidden] { display: none; }
#scoreNum { min-width: 86px; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
#scoreNum.bump { animation: bump 0.3s; }
.sbar { position: relative; flex: 1; height: 18px; margin-right: 12px; border: 3px solid var(--ink); border-radius: 999px; background: var(--paper); }
#sFill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #ffe066, #ffc61a 50%, #ff8a3c); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.55); transition: width 0.4s ease-out; }
.sstar { position: absolute; top: 50%; transform: translate(-50%, -54%); font-style: normal; font-size: 28px; line-height: 1; color: var(--paper-2); -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; }
.sstar.on { color: var(--gold); }
.sstar.pop { animation: sstarPop 0.6s cubic-bezier(0.2, 1.8, 0.4, 1); }
@keyframes sstarPop { 0% { transform: translate(-50%, -54%) scale(0.4) rotate(-40deg); } 60% { transform: translate(-50%, -54%) scale(1.6) rotate(10deg); } }

/* kombo sayacı */
.hudrow { display: flex; gap: 8px; align-items: stretch; min-height: 44px; }
.hudrow .goals { flex: 1; align-content: center; }
.combo { flex: none; align-self: center; background: var(--ink); color: #fff; border-radius: 14px; padding: 4px 10px 5px; text-align: center; min-width: 66px; }
.combo b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.combo span { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
.combo.bump { animation: bump 0.3s; }
.moves.bump { animation: bump 0.3s; }

/* ---------- Doomies modu ---------- */
body.doom { --sky-1: #2a0a16; --sky-2: #c23a1c; --board: #33161c; --board-2: #47212a; }
body.doom .station b, body.doom .station span, body.doom #legend, body.doom #legend b { color: #fff; }
body.doom .station span.hard { background: var(--gold); color: var(--ink); }
.boss { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); border-radius: 16px; padding: 6px 8px 6px 10px; }
.boss[hidden] { display: none; }
.boss-mid { flex: 1; min-width: 0; }
.boss-mid b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 16px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.boss-mid small { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: var(--ink-dim); white-space: nowrap; }
.boss-mid small i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ink); flex: none; }
.hp { position: relative; height: 16px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--paper-2); overflow: hidden; margin: 3px 0; }
#hpFill { height: 100%; width: 100%; background: linear-gradient(#ff7a6b, #e0213a); transition: width 0.3s ease-out; }
#hpText { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.boss-timer { flex: none; text-align: center; background: var(--ink); color: #fff; border-radius: 12px; padding: 3px 8px 4px; }
.boss-timer b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1; color: var(--accent); }
.boss-timer span { font-size: 10px; font-weight: 800; text-transform: uppercase; }
.doomie { --body: #ff5a2e; position: relative; width: 46px; height: 42px; flex: none; margin-top: 6px; border-radius: 46% 46% 40% 40%; background: var(--body); border: 3px solid var(--ink); animation: bob 1.2s ease-in-out infinite alternate; }
.doomie .horn { position: absolute; top: -11px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 12px solid var(--ink); }
.doomie .horn.l { left: 2px; transform: rotate(-22deg); } .doomie .horn.r { right: 2px; transform: rotate(22deg); }
.doomie .eye { position: absolute; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); }
.doomie .eye::after { content: ""; position: absolute; left: 2px; top: 2px; width: 3px; height: 3px; border-radius: 50%; background: var(--ink); }
.doomie .eye::before { content: ""; position: absolute; left: -3px; top: -6px; width: 12px; height: 3px; background: var(--ink); border-radius: 2px; }
.doomie .eye.l { left: 7px; } .doomie .eye.l::before { transform: rotate(22deg); }
.doomie .eye.r { right: 7px; } .doomie .eye.r::before { transform: rotate(-22deg); }
.doomie .mouth { position: absolute; left: 50%; bottom: 6px; width: 16px; height: 7px; margin-left: -8px; border: 2.5px solid var(--ink); border-bottom: 0; border-radius: 10px 10px 0 0; }
.doomie.rage .eye { background: #ff3b3b; }
.doomie.rage { animation: bob 0.35s ease-in-out infinite alternate; }
.doomie.hit { animation: hit 0.3s; }
@keyframes hit { 30% { transform: scale(0.82, 1.15) rotate(-8deg); filter: brightness(2); } }
.doomie.atk { animation: atk 0.45s; }
@keyframes atk { 40% { transform: translateY(14px) scale(1.25); } }
.doomie.dead { animation: none; transform: rotate(180deg) scale(0.8); opacity: 0.5; }
.dmg { position: absolute; left: 8px; top: -6px; font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--accent); -webkit-text-stroke: 3px #fff; paint-order: stroke fill; animation: dmg 0.8s ease-out forwards; pointer-events: none; z-index: 3; }
@keyframes dmg { to { transform: translateY(-26px); opacity: 0; } }
.boss { position: relative; }
/* Doomies taşları */
.ember { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffe08a, #ff6a00 45%, #5a1300 100%); box-shadow: 0 0 0 2.5px var(--ink), 0 0 14px #ff7a1a; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: calc(var(--cell) * 0.5); line-height: 1; color: #fff; text-shadow: 0 2px 0 #5a1300; animation: emberPulse 0.6s ease-in-out infinite alternate; }
.ember::before { content: attr(data-fuse); }
@keyframes emberPulse { to { filter: brightness(1.3); } }
.ash { border-radius: 34% 42% 36% 46%; background: radial-gradient(circle at 35% 30%, #cfc9dc, #6b6580 80%); box-shadow: inset 0 0 0 3px var(--ink); }
.ash::before { content: ""; position: absolute; left: 22%; top: 30%; width: 26%; height: 12%; border-radius: 50%; background: rgba(42, 26, 94, 0.35); box-shadow: calc(var(--cell) * 0.2) calc(var(--cell) * 0.2) 0 rgba(42, 26, 94, 0.3); }
.lava { inset: 0; background: linear-gradient(90deg, #ff5a00, #ffb300, #ff5a00, #ffb300, #ff5a00) 0 0 / 300% 100%; box-shadow: inset 0 4px 0 #ffe27a, inset 0 -10px 14px rgba(120, 10, 0, 0.6); animation: lava 2.4s linear infinite; }
@keyframes lava { to { background-position: 300% 0; } }

/* tahtanın üstündeki kedi evi: kedi kapıdan çıkıp konuşur. Mesaj yokken özel taş rehberi görünür. */
#strip { display: flex; align-items: flex-end; gap: 10px; height: 50px; flex: none; margin-top: 2px; }
.house { position: relative; width: 54px; height: 44px; flex: none; background: #ffe9c4; border: 3px solid var(--ink); border-radius: 6px 6px 8px 8px; margin-top: 8px; }
.house .roof { position: absolute; left: -9px; right: -9px; top: -15px; height: 16px; background: var(--accent); border: 3px solid var(--ink); border-radius: 10px 10px 3px 3px; }
.house .door { position: absolute; left: 50%; bottom: -3px; width: 36px; height: 34px; margin-left: -18px; background: var(--ink); border: 3px solid var(--ink); border-radius: 18px 18px 0 0; overflow: hidden; }
#houseCat { display: block; width: 34px; height: 34px; margin: 0 -2px; transform: translateY(72%); transition: transform 0.3s steps(5); }
#strip.on #houseCat, #strip.peek #houseCat { transform: translateY(6%); }
.talk { position: relative; flex: 1; min-width: 0; height: 44px; }
#legend, #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; transition: opacity 0.15s, transform 0.2s; }
#legend { gap: 12px; color: var(--ink-dim); font-size: 12.5px; font-weight: 800; }
#legend b { color: var(--ink); }
#msg { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.1; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 0 12px; opacity: 0; transform: translateX(-10px) scale(0.94); transform-origin: left center; }
#msg::before { content: ""; position: absolute; left: -10px; bottom: 9px; width: 14px; height: 14px; background: inherit; border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
#msg.long { font-size: 13px; }
#msg.cheer { background: var(--gold); font-size: 19px; font-weight: 800; }
#msg.sad { background: #dfe8ff; }
#strip.on #legend { opacity: 0; }
#strip.on #msg { opacity: 1; transform: none; }
body.doom #msg { color: var(--ink); }
.end-cat { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
.end-cat .pix { width: 56px; height: 56px; flex: none; }
.end-cat b { font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 1.15; text-align: left; background: var(--paper-2); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; }

/* ---------- sade oyun ekranı: küçük düğmeler, büyük balonlar ---------- */
#game { padding: 8px 8px 8px; gap: 6px; }
.top { gap: 6px; }
.icon-btn { width: 34px; height: 34px; border-radius: 11px; border-width: 2.5px; box-shadow: 0 2px 0 var(--ink); font-size: 16px; }
.station b { font-size: 18px; }
.station span { font-size: 11px; }
.combo, .moves { flex: none; min-width: 50px; padding: 2px 7px 3px; border-radius: 11px; text-align: center; }
.moves { border-width: 2.5px; box-shadow: 0 2px 0 var(--ink); }
.combo { border: 2.5px solid var(--ink); }
.combo b, .moves b { font-size: 19px; }
.combo span, .moves span { display: block; font-size: 8.5px; letter-spacing: 0.3px; }
.hudrow { min-height: 30px; }
.goals { gap: 6px; min-height: 30px; }
.goal { gap: 5px; border-width: 2.5px; box-shadow: 0 2px 0 var(--ink); padding: 1px 9px 1px 3px; font-size: 16px; }
.goal .mini { width: 22px; height: 22px; }
.scorebar { gap: 8px; }
#scoreNum { min-width: 62px; font-size: 17px; }
.sbar { height: 12px; border-width: 2.5px; margin-right: 12px; }
.sstar { font-size: 21px; -webkit-text-stroke: 2px var(--ink); }
#strip { height: 38px; gap: 8px; margin-top: 0; }
.house { width: 42px; height: 32px; margin-top: 6px; border-width: 2.5px; }
.house .roof { left: -7px; right: -7px; top: -12px; height: 13px; border-width: 2.5px; }
.house .door { width: 28px; height: 27px; margin-left: -14px; border-width: 2.5px; }
#houseCat { width: 26px; height: 26px; }
.talk { height: 34px; }
#msg { font-size: 14px; border-width: 2.5px; padding: 0 10px; }
#msg.cheer { font-size: 16px; }
#msg.long { font-size: 12px; }
.inner { inset: 3.5%; }
.catbtn { width: 46px; height: 42px; border-radius: 12px; border-width: 2.5px; padding: 2px; box-shadow: 0 2px 0 var(--ink); }
.catbtn em { min-width: 18px; height: 18px; line-height: 18px; font-size: 12px; right: -6px; top: -6px; }
#catbar { gap: 10px; }
/* tahta şekli: hücre zeminleri ayrı çizilir; boşluklar görünmez */
#board { background: none; outline: none; box-shadow: none; border-radius: 0; }
#bgLayer { position: absolute; inset: 0; pointer-events: none; }
.bgc { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); background: var(--board); }
.bgc.alt { background: var(--board-2); }
.tile.void { display: none; }
#boardWrap { position: relative; }
#skipBtn { position: absolute; right: 4px; top: 4px; z-index: 9; font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--ink); background: var(--gold); border: 2.5px solid var(--ink); border-radius: 999px; padding: 4px 12px; box-shadow: 0 3px 0 var(--ink); }
#skipBtn[hidden] { display: none; }
#finalSum { position: absolute; left: 8%; right: 8%; top: 28%; z-index: 9; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); padding: 14px 16px; text-align: center; animation: cardIn 0.3s cubic-bezier(0.2, 1.4, 0.4, 1); }
#finalSum[hidden] { display: none; }
#finalSum b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 22px; margin-bottom: 6px; }
#finalSum div { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; padding: 2px 0; }
#finalSum div.total { border-top: 2.5px solid var(--ink); margin-top: 6px; padding-top: 6px; font-size: 18px; color: var(--accent); }
#endExtra[hidden] { display: none; }

.cat-run.sleep .pix { animation: snooze 1.3s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes snooze { 0%, 100% { transform: rotate(-80deg) scale(0.92, 0.86); } 50% { transform: rotate(-80deg) scale(0.98, 0.94); } }
.shade.night { background: radial-gradient(circle at 78% 14%, rgba(255, 243, 196, 0.25), transparent 30%), rgba(14, 22, 70, 0.62); }
.shade.night .moon { position: absolute; right: 12%; top: 6%; width: calc(var(--cell) * 0.8); height: calc(var(--cell) * 0.8); border-radius: 50%; box-shadow: calc(var(--cell) * -0.2) calc(var(--cell) * 0.08) 0 0 #fff3c4; }
.dream { position: absolute; left: 0; top: 0; z-index: 8; pointer-events: none; animation: shadeIn 0.4s both; }
.dream.out { animation: shadeOut 0.3s both; }
.dream i { position: absolute; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
.dream i:nth-child(1) { width: 10px; height: 10px; left: -6px; top: calc(var(--cell) * 1.25); }
.dream i:nth-child(2) { width: 16px; height: 16px; left: 4px; top: calc(var(--cell) * 0.9); }
.dream b { position: absolute; left: 14px; top: 0; width: calc(var(--cell) * 1.15); height: calc(var(--cell) * 0.95); border-radius: 50%; background: #fff; border: 3px solid var(--ink); display: grid; place-items: center; font-size: calc(var(--cell) * 0.5); }
.dream .glass { display: inline-block; animation: rewind 0.9s linear infinite; }
@keyframes rewind { to { transform: rotate(-360deg); } }
.moon-orb { position: fixed; z-index: 60; margin: -18px 0 0 -18px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 800 15px "Baloo 2", sans-serif; color: #2a1a5e; background: radial-gradient(circle at 35% 35%, #fffbe6, #ffd95a); box-shadow: 0 0 14px 4px rgba(255, 233, 120, 0.8); pointer-events: none; transition: transform 0.6s cubic-bezier(0.5, -0.3, 0.6, 1); }
#wheelFab { bottom: 54px; }
#devBar { display: flex; gap: 6px; padding: 5px 10px; background: #2a1a5e; z-index: 2; }
#devBar button { flex: 1; font: 700 12px var(--font-body, sans-serif); padding: 5px 8px; border-radius: 10px; border: 2px solid #fff3; background: #ffffff18; color: #fff; }
#devBar button.on { background: #ffc61a; color: #2a1a5e; border-color: #2a1a5e; }
.giant-cat { position: absolute; left: 0; top: 0; width: calc(var(--cell) * 4); height: calc(var(--cell) * 4); z-index: 9; pointer-events: none; transition: transform 0.55s cubic-bezier(0.55, 0, 0.9, 0.4); }
.giant-cat .pix { display: block; width: 100%; height: 100%; image-rendering: pixelated; background-size: contain; background-repeat: no-repeat; filter: drop-shadow(0 6px 0 rgba(42, 26, 94, 0.5)); }
.giant-cat.stomp .pix { animation: stomp 0.5s ease-out; transform-origin: 50% 100%; }

<body>

<main id="map" class="screen on">
  <header class="map-head">
    <div>
      <h1 id="brand">Balon Durağı</h1>
      <p id="mapSub">Ormandan yıldızlara 60 durak</p>
    </div>
    <div class="counts">
      <span class="count star" id="totalStars" aria-label="Toplanan yıldız">★ 0</span>
      <span class="count coin" id="totalGold" aria-label="Kazanılan altın">0</span>
      <button class="count" id="edOpen" aria-label="Bölüm editörü" hidden>✎</button>
      <button class="count dia" id="diaBtn" aria-label="Elmaslar ve kedi dükkânı" hidden>0</button>
    </div>
  </header>
  <button id="coach" aria-label="Elmasla kedi dükkânından kedi alırsın. Dükkânı aç">Elmas kazandın! Buraya dokun: elmasla <b>kedi</b> alırsın, kediler bölümleri kolaylaştırır.</button>
  <button id="wheelFab" aria-label="Günlük çark"><svg viewBox="-20 -20 40 40" aria-hidden="true"><g class="fab-rot"><path d="M0 0 L0 -17 A17 17 0 0 1 17 0Z" fill="#ff4f8b"/><path d="M0 0 L17 0 A17 17 0 0 1 0 17Z" fill="#ffc61a"/><path d="M0 0 L0 17 A17 17 0 0 1 -17 0Z" fill="#3ddc84"/><path d="M0 0 L-17 0 A17 17 0 0 1 0 -17Z" fill="#4aa8ff"/><circle r="17" fill="none" stroke="#2a1a5e" stroke-width="3"/><circle r="4" fill="#fff" stroke="#2a1a5e" stroke-width="2"/></g></svg><b>Çark</b></button>
  <div id="mapScroll"><svg id="mapSvg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Durak haritası"></svg></div>
  <div id="devBar"><button id="devAdmin">Yönetici: kapalı</button><button id="devReset">Sıfırla</button></div>
</main>

<main id="editor" class="screen">
  <div class="ed-top">
    <button class="icon-btn" id="edBack" aria-label="Haritaya dön">←</button>
    <b>Bölüm Editörü</b>
    <select id="edLoad" aria-label="Durak yükle"></select>
  </div>
  <div class="ed-scroll">
    <div class="ed-row">
      <label>Renk <input id="edColors" type="number" min="3" max="6"></label>
      <label>Hamle <input id="edMoves" type="number" min="5" max="60"></label>
      <button class="btn ghost ed-small" id="edClear">Tahtayı temizle</button>
    </div>
    <div id="edTools" role="toolbar" aria-label="Fırça"></div>
    <div id="edGrid" aria-label="Tahta: fırçayla boya"></div>
    <div class="ed-head">Hedefler</div>
    <div id="edGoals"></div>
    <div class="ed-row">
      <button class="btn ghost ed-small" id="edAddGoal">Renk hedefi ekle</button>
      <button class="btn ghost ed-small" id="edAuto">Tahtadan doldur</button>
    </div>
    <div class="ed-row">
      <button class="btn primary ed-small" id="edTest">Dene</button>
      <button class="btn goldb ed-small" id="edMeasure">Otomatik oyuncuyla ölç</button>
    </div>
    <p id="edStatus" role="status">Fırçayı seç, tahtaya dokunarak boya.</p>
    <div class="ed-row">
      <button class="btn ghost ed-small" id="edExport">Kodu kopyala</button>
      <button class="btn ghost ed-small" id="edImport">Kodu yükle</button>
    </div>
    <textarea id="edCode" rows="3" aria-label="Bölüm kodu" placeholder="Bölüm kodu burada görünür; başka bir kodu yapıştırıp Kodu yükle'ye basabilirsin."></textarea>
  </div>
</main>

<main id="game" class="screen">
  <div class="top">
    <button class="icon-btn" id="backBtn" aria-label="Haritaya dön">←</button>
    <div class="station"><b id="stName">Koç · Mars</b><span id="stNo" hidden></span></div>
    <button class="icon-btn" id="muteBtn" aria-label="Sesi aç veya kapat">♪</button>
    <div class="combo" id="combo" aria-label="Kombo"><b id="comboNow">x0</b><span id="comboBest">rekor x0</span></div>
    <div class="moves" id="movesBox"><b id="moves">0</b><span>hamle</span></div>
  </div>
  <div class="hudrow">
    <div class="goals" id="goals" aria-label="Hedefler"></div>
    <div class="boss" id="boss" hidden>
      <div class="doomie" id="doomie" aria-hidden="true"><i class="horn l"></i><i class="horn r"></i><i class="crown"></i><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div>
      <div class="boss-mid">
        <b id="bossName"></b>
        <div class="hp" role="img" id="hpBar"><div id="hpFill"></div><span id="hpText"></span></div>
        <small id="bossInfo"></small>
      </div>
      <div class="boss-timer"><b id="bossTimer">3</b><span>saldırı</span></div>
    </div>
  </div>
  <div class="scorebar" id="scorebar">
    <b id="scoreNum" aria-label="Puan">0</b>
    <div class="sbar" role="img" aria-label="Yıldız barı"><div id="sFill"></div><i class="sstar">★</i><i class="sstar">★</i><i class="sstar">★</i></div>
  </div>
  <div id="strip">
    <div class="house" aria-hidden="true"><i class="roof"></i><div class="door"><span class="pix" id="houseCat"></span></div></div>
    <div class="talk">
      <div id="msg" role="status"></div>
    </div>
  </div>
  <div id="boardWrap"><div id="board"><div id="bgLayer"></div><canvas id="fx"></canvas><div id="finalSum" hidden></div></div><button id="skipBtn" hidden>Geç ⏭</button></div>
  <div id="catbar" hidden aria-label="Kediler"></div>
</main>

<div id="level" class="overlay" role="dialog" aria-modal="true" aria-labelledby="lvTitle">
  <div class="card">
    <button class="close" id="lvClose" aria-label="Kapat">×</button>
    <div class="glyph" id="lvGlyph" aria-hidden="true">♈</div>
    <h2 id="lvTitle"></h2>
    <p id="lvGoals"></p>
    <div class="big-stars" id="lvStars" style="font-size:30px"></div>
    <div class="actions">
      <button class="btn primary" id="lvPlay"></button>
      <button class="btn goldb" id="lvHard"></button>
    </div>
  </div>
</div>

<div id="shop" class="overlay" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
  <div class="card">
    <button class="close" id="shopClose" aria-label="Kapat">×</button>
    <h2 id="shopTitle">Kedi Dükkânı</h2>
    <p id="shopInfo"></p>
    <div id="shopList"></div>
  </div>
</div>

<div id="wheel" class="overlay" role="dialog" aria-modal="true" aria-labelledby="wheelTitle">
  <div class="card">
    <button class="close" id="wheelClose" aria-label="Kapat">×</button>
    <h2 id="wheelTitle">Günlük Çark</h2>
    <div id="wheelBox"></div>
    <p id="wheelResult" role="status"></p>
    <div class="actions"><button class="btn goldb" id="wheelSpin">Çevir</button></div>
    <details class="odds"><summary>Olasılıklar</summary><div id="wheelOdds"></div></details>
  </div>
</div>

<div id="end" class="overlay" role="dialog" aria-modal="true" aria-labelledby="endTitle">
  <div class="card">
    <div class="end-cat"><span class="pix" id="endCat"></span><b id="endSay"></b></div>
    <div id="endMedal"></div>
    <h2 id="endTitle"></h2>
    <div class="big-stars" id="endStars"></div>
    <p id="endText"></p>
    <p id="endGain"></p>
    <div class="actions">
      <button class="btn goldb" id="endExtra" hidden></button>
      <button class="btn primary" id="endMain"></button>
      <button class="btn goldb" id="endHard"></button>
      <button class="btn ghost" id="endMap">Haritaya dön</button>
    </div>
  </div>
</div>

function shapeLayout(base, shape) {
  const g = base.map(r => r.split(''));
  if (!shape) return base.slice();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (SHAPES[shape][r][c] !== '#') continue;
    if (g[r][c] === 'K') { for (let y = r + 1; y < ROWS - 1; y++) if (SHAPES[shape][y][c] !== '#' && g[y][c] === '.') { g[y][c] = 'K'; break; } }
    g[r][c] = '#';
  }
  return g.map(r => r.join(''));
}

function rnd(n) { return Math.floor(Math.random() * n); }
function inB(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
const SPECIALS = { rocketH: 1, rocketV: 1, rocketX: 1, giant: 1, bomb: 1, rainbow: 1 };
function isSpecial(t) { return !!t && SPECIALS[t.kind] === 1; }
function canSwap(t) { return !!t && ((t.kind === 'b' && !t.lock) || isSpecial(t) || t.kind === 'kitten'); }
/** Yanında eşleşme olunca ya da patlamayla kırılan engeller. */
function breakable(t) { return !!t && (t.kind === 'crate' || t.kind === 'ash' || t.kind === 'ember' || t.kind === 'ice'); }
function isRocket(t) { return !!t && (t.kind === 'rocketH' || t.kind === 'rocketV'); }
function isVoid(t) { return !!t && t.kind === 'void'; }
function isB(t, color) { return !!t && t.kind === 'b' && (color === undefined || t.color === color); }

/** (r,c)'ye, solundaki ve üstündeki ikiliyle 3'lü oluşturmayan bir renk seçer. */
function safeColor(grid, r, c, colors) {
  for (let i = 0; i < 20; i++) {
    const k = rnd(colors);
    const h = c >= 2 && isB(grid[r][c - 1], k) && isB(grid[r][c - 2], k);
    const v = r >= 2 && grid[r - 1] && grid[r - 2] && isB(grid[r - 1][c], k) && isB(grid[r - 2][c], k);
    if (!h && !v) return k;
  }
  return rnd(colors);
}

  const grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid.push([]);
    for (let c = 0; c < COLS; c++) {
      // layout: 9 satır × 7 harf. '.' balon, C sandık, I buz (2 vuruş), L zincirli balon, K yavru kedi
      const ch = level.layout ? level.layout[r][c] : r >= ROWS - (level.crateRows || 0) ? 'C' : '.';
      if (ch === '#') grid[r].push({ id: _id++, kind: 'void', color: -1 });
      else if (ch === 'C') grid[r].push({ id: _id++, kind: 'crate', color: -1 });
      else if (ch === 'I') grid[r].push({ id: _id++, kind: 'ice', color: -1, hp: 2 });
      else if (ch === 'K') grid[r].push({ id: _id++, kind: 'kitten', color: -1 });
      else {
        grid[r].push({ id: _id++, kind: 'b', color: safeColor(grid, r, c, level.colors) });
        if (ch === 'L') grid[r][c].lock = true;
      }
    }
  }
  const g = { level, grid, goals: level.goals.map(x => ({ ...x, left: x.n })), moves: level.moves, score: 0, won: false, lost: false, lava: 0, boss: null };
  if (level.doom) {
    const el = ELEMENTS[level.element];
    g.boss = { doom: true, element: level.element, name: el.name, weak: el.weak, resist: el.resist, hp: level.hp, max: level.hp, every: 3, timer: 3, lavaTimer: LAVA_EVERY, rage: false, recede: false, n: 0 };
  } else if (level.bossStop) {
    const d = level.bossStop;
    g.boss = { doom: false, name: d.name, title: d.title, body: d.body, trick: d.trick, weak: d.weak, resist: d.resist, hp: d.hp, max: d.hp, every: 3, timer: 3, lavaTimer: Infinity, rage: false, recede: false, n: 0 };
  }
  ensureMove(g);
  return g;
}

function cloneGame(g) {
  return { level: g.level, grid: g.grid.map(row => row.map(t => (t ? { ...t } : null))), goals: g.goals.map(x => ({ ...x })), moves: g.moves, score: g.score, won: g.won, lost: g.lost, lava: g.lava, boss: g.boss ? { ...g.boss } : null };
}

/** Aynı renkten 3+ balonluk yatay ve dikey diziler. */
function findRuns(grid) {
  const runs = [];
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const t = grid[r][c];
      if (!isB(t)) { c++; continue; }
      let e = c + 1;
      while (e < COLS && isB(grid[r][e], t.color)) e++;
      if (e - c >= 3) { const cells = []; for (let x = c; x < e; x++) cells.push([r, x]); runs.push({ dir: 'H', cells, color: t.color }); }
      c = e;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const t = grid[r][c];
      if (!isB(t)) { r++; continue; }
      let e = r + 1;
      while (e < ROWS && isB(grid[e][c], t.color)) e++;
      if (e - r >= 3) { const cells = []; for (let y = r; y < e; y++) cells.push([y, c]); runs.push({ dir: 'V', cells, color: t.color }); }
      r = e;
    }
  }
  return runs;
}

/** Kesişen dizileri tek eşleşmede toplar (L ve T şekilleri). */
function findClusters(grid) {
  const clusters = [];
  for (const run of findRuns(grid)) {
    const keys = run.cells.map(([r, c]) => r * COLS + c);
    let target = null;
    for (let i = clusters.length - 1; i >= 0; i--) {
      const cl = clusters[i];
      if (!keys.some(k => cl.keys.has(k))) continue;
      if (!target) { target = cl; }
      else { cl.keys.forEach(k => target.keys.add(k)); target.runs.push(...cl.runs); clusters.splice(i, 1); }
    }
    if (!target) { target = { keys: new Set(), runs: [], color: run.color }; clusters.push(target); }
    keys.forEach(k => target.keys.add(k));
    target.runs.push(run);
  }
  return clusters;
}

/** Eşleşmenin vereceği özel taş: 4'lü roket, L/T bomba, 5'li gökkuşağı. */
function specialFor(cluster, pref) {
  const runs = cluster.runs;
  const longest = runs.reduce((a, b) => (b.cells.length > a.cells.length ? b : a));
  const hasH = runs.some(x => x.dir === 'H'), hasV = runs.some(x => x.dir === 'V');
  let kind = null;
  if (longest.cells.length >= 5) kind = 'rainbow';
  else if (hasH && hasV) kind = 'bomb';
  else if (longest.cells.length === 4) kind = longest.dir === 'H' ? 'rocketV' : 'rocketH';
  if (!kind) return null;
  let pos = null;
  for (const p of pref) if (cluster.keys.has(p[0] * COLS + p[1])) { pos = p; break; }
  if (!pos && hasH && hasV) {
    const hKeys = new Set();
    runs.filter(x => x.dir === 'H').forEach(x => x.cells.forEach(([r, c]) => hKeys.add(r * COLS + c)));
    for (const x of runs.filter(y => y.dir === 'V')) for (const cell of x.cells) if (!pos && hKeys.has(cell[0] * COLS + cell[1])) pos = cell;
  }
  if (!pos) pos = longest.cells[Math.floor(longest.cells.length / 2)];
  return { tile: { id: _id++, kind, color: -1 }, r: pos[0], c: pos[1] };
}

/** Özel taşın patlattığı hücreler. color: gökkuşağının hedef rengi. */
function blastCells(grid, r, c, color) {
  const t = grid[r][c], cells = [[r, c]];
  if (t.kind === 'rocketH') { for (let x = 0; x < COLS; x++) cells.push([r, x]); }
  else if (t.kind === 'rocketV') { for (let y = 0; y < ROWS; y++) cells.push([y, c]); }
  else if (t.kind === 'giant') {
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (inB(r + dy, c + dx)) cells.push([r + dy, c + dx]);
    for (let x = 0; x < COLS; x++) cells.push([r, x]);
    for (let y = 0; y < ROWS; y++) cells.push([y, c]);
  }
  else if (t.kind === 'rocketX') { for (let x = 0; x < COLS; x++) cells.push([r, x]); for (let y = 0; y < ROWS; y++) cells.push([y, c]); }
  else if (t.kind === 'bomb') {
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const near = Math.abs(dy) <= 1 && Math.abs(dx) <= 1;
      if (!near && Math.abs(dy) + Math.abs(dx) > 2) continue;
      if (inB(r + dy, c + dx)) cells.push([r + dy, c + dx]);
    }
  } else if (t.kind === 'rainbow') {
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (isB(grid[y][x], color)) cells.push([y, x]);
  }
  return cells;
}

function mostCommonColor(grid, skip) {
  const count = {};
  let best = 0, bestN = -1;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const t = grid[y][x];
    if (!isB(t) || skip.has(y * COLS + x)) continue;
    count[t.color] = (count[t.color] || 0) + 1;
    if (count[t.color] > bestN) { bestN = count[t.color]; best = t.color; }
  }
  return best;
}

/** (r,c)'deki balon bir 3'lünün parçası mı? */
function matchAt(grid, r, c) {
  const t = grid[r][c];
  if (!isB(t)) return false;
  let h = 1, v = 1;
  for (let x = c - 1; x >= 0 && isB(grid[r][x], t.color); x--) h++;
  for (let x = c + 1; x < COLS && isB(grid[r][x], t.color); x++) h++;
  for (let y = r - 1; y >= 0 && isB(grid[y][c], t.color); y--) v++;
  for (let y = r + 1; y < ROWS && isB(grid[y][c], t.color); y++) v++;
  return h >= 3 || v >= 3;
}

/** Özel taş patlamalarını ve eşleşmeleri, zincirler bitene kadar çözer; adımları döndürür. */
function resolve(g, acts, pref, extra) {
  const steps = [];
  let first = true;
  while (true) {
    const clusters = findClusters(g.grid);
    if (!clusters.length && !(first && (acts.length || (extra && extra.length)))) break;
    const remove = new Map(), created = [], mergeTo = new Map(), blasts = [], hit = new Set(), unlocked = [], cracked = [];
    const mark = (y, x) => {
      const k = y * COLS + x, t = g.grid[y][x];
      if (remove.has(k) || hit.has(k) || !t || t.kind === 'lava' || t.kind === 'kitten' || t.kind === 'void') return false;
      if (t.lock) {                       // zincir kırılır, balon yerinde kalır
        hit.add(k); t.lock = false; unlocked.push({ tile: t, r: y, c: x });
        for (const goal of g.goals) if (goal.type === 'lock' && goal.left > 0) goal.left--;
        return false;
      }
      if (t.hp > 1) { hit.add(k); t.hp--; cracked.push({ tile: t, r: y, c: x }); return false; }   // buz çatlar
      remove.set(k, [y, x]);
      return true;
    };
    for (const cl of clusters) {
      for (const k of cl.keys) {
        const y = Math.floor(k / COLS), x = k % COLS;
        mark(y, x);
        // eşleşen balonlara değen sandıklar kırılır
        for (const [dy, dx] of N4) {
          const ny = y + dy, nx = x + dx;
          if (inB(ny, nx) && breakable(g.grid[ny][nx])) mark(ny, nx);
        }
      }
      const sp = specialFor(cl, pref);
      if (sp && !remove.has(sp.r * COLS + sp.c)) {
        // zincirli balonun yerine özel taş konmaz: eşleşmeden başka bir hücre seçilir
        const alt = [...cl.keys].find(k => remove.has(k));
        if (alt === undefined) continue;
        sp.r = Math.floor(alt / COLS); sp.c = alt % COLS;
      }
      if (sp) { created.push(sp); for (const k of cl.keys) mergeTo.set(k, [sp.r, sp.c]); }
    }
    if (first && extra) {
      // kedinin vurduğu hücreler: özel taşa denk gelirse o da patlar
      for (const [y, x] of extra) { if (isSpecial(g.grid[y][x])) acts.push({ r: y, c: x, color: -1 }); else mark(y, x); }
    }
    let blasted = false;
    if (first && acts.length) {
      // özel taşlar: menzildeki diğer özel taşlar da zincirleme patlar
      blasted = true;
      const queue = acts.slice();
      for (const q of queue) mark(q.r, q.c);
      while (queue.length) {
        const q = queue.shift();
        const t = g.grid[q.r][q.c];
        const color = t.kind === 'rainbow' && q.color < 0 ? mostCommonColor(g.grid, remove) : q.color;
        blasts.push({ kind: t.kind, r: q.r, c: q.c, color });
        for (const [y, x] of blastCells(g.grid, q.r, q.c, color)) {
          if (mark(y, x) && isSpecial(g.grid[y][x])) queue.push({ r: y, c: x, color: -1 });
        }
      }
    }
    const popped = [];
    let damage = 0;
    for (const [y, x] of remove.values()) {
      const u = g.grid[y][x];
      popped.push({ tile: u, r: y, c: x, to: mergeTo.get(y * COLS + x) || null });
      for (const goal of g.goals) {
        if (goal.left <= 0) continue;
        if (u.kind === 'b' && goal.type === 'color' && goal.color === u.color) goal.left--;
        if (u.kind === 'crate' && goal.type === 'crate') goal.left--;
        if (u.kind === 'ice' && goal.type === 'ice') goal.left--;
      }
      if (g.boss && u.kind === 'b') damage += u.color === g.boss.weak ? 4 : u.color === g.boss.resist ? 1 : 2;
      g.grid[y][x] = null;
    }
    if (g.boss) {
      g.boss.hp = Math.max(0, g.boss.hp - damage);
      g.goals[0].left = g.boss.hp;
      // su (mavi) 4'lü ve üstü eşleşme lavı bir sıra geri iter
      if (g.lava > 0 && clusters.some(cl => cl.color === 3 && cl.keys.size >= 4)) g.boss.recede = true;
    }
    for (const s of created) g.grid[s.r][s.c] = s.tile;
    const { spawned, rescued } = settleBoard(g);
    const mult = steps.length + 1;
    let pts = 0, cy = 0, cx = 0, cn = 0;
    for (const p of popped) {
      pts += p.tile.kind === 'b' ? SCORE.balloon * mult : SCORE.block;
      cy += p.r; cx += p.c; cn++;
    }
    pts += (unlocked.length + cracked.length) * SCORE.block + rescued.length * SCORE.rescue;
    for (const s of created) pts += SCORE.special[s.tile.kind] || 0;
    g.score += pts;
    const at = cn ? [cy / cn, cx / cn] : created.length ? [created[0].r, created[0].c] : [ROWS / 2, COLS / 2];
    steps.push({ popped, created, spawned, rescued, unlocked, cracked, layout: snapshot(g), blasted, blasts, damage, score: pts, mult, at, goals: g.goals.map(x => x.left) });
    first = false;
    pref = [];
  }
  return steps;
}

/**
 * Bölüm kazanılınca: tahtada kalan özel taşlar sırayla patlar, artan her hamle de bonus puan verir.
 * Arayüzün canlandıracağı adımları ve kazanılan bonusu döndürür.
 */
function finale(g) {
  const before = g.score, steps = [];
  let fired = 0;
  for (let guard = 0; guard < 40; guard++) {
    let found = null;
    for (let r = 0; r < ROWS && !found; r++) for (let c = 0; c < COLS && !found; c++) if (isSpecial(g.grid[r][c])) found = [r, c];
    if (!found) break;
    fired++;
    for (const st of resolve(g, [{ r: found[0], c: found[1], color: -1 }], [])) steps.push(st);
  }
  g.score += fired * SCORE.finaleSpecial + g.moves * SCORE.finaleMove;
  return { steps, fired, bonus: g.score - before };
}

/** Uzun zincir ödülü: rastgele bir balon özel taşa dönüşür. */
function comboGift(g, chain) {
  let kind = null;
  for (const k of Object.keys(COMBO_GIFT).map(Number).sort((a, b) => a - b)) if (chain >= k) kind = COMBO_GIFT[k];
  if (!kind) return null;
  const cells = randomBalloons(g, 1);
  if (!cells.length) return null;
  const [r, c] = cells[0];
  const tile = { id: _id++, kind: kind === 'rocket' ? (rnd(2) ? 'rocketH' : 'rocketV') : kind, color: -1 };
  const old = g.grid[r][c];
  g.grid[r][c] = tile;
  return { r, c, tile, old };
}

/**
 * Bir hamle: a ile b'nin yerini değiştirir (b yoksa a'daki özel taşı patlatır).
 * Geçersizse {invalid:true}; değilse arayüzün sırayla canlandıracağı adımları döndürür.
 */
function move(g, a, b) {
  if (g.won || g.lost) return null;
  const ta = g.grid[a[0]][a[1]], tb = b ? g.grid[b[0]][b[1]] : null;
  if (!canSwap(ta)) return null;
  if (b && (!canSwap(tb) || Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) !== 1)) return null;
  if (!b && !isSpecial(ta)) return null;
  const acts = [];
  let cross = false;
  if (b) {
    g.grid[a[0]][a[1]] = tb; g.grid[b[0]][b[1]] = ta;
    // iki roket birleşince artı roket olur: biri satırı, öteki sütunu temizler (yatay+yatay da)
    if (ta.kind === 'bomb' && tb.kind === 'bomb') {
      // iki bomba: gökten dev kedi iner, pati darbesi 5x5 alanı ve iki çizgiyi temizler
      ta.kind = 'giant'; g.grid[a[0]][a[1]] = null; cross = 'giant';
      acts.push({ r: b[0], c: b[1], color: -1 });
    } else if (isRocket(ta) && isRocket(tb)) {
      // iki roket tek taşta birleşir: artı roket, aynı merkezden hem satırı hem sütunu temizler
      ta.kind = 'rocketX'; g.grid[a[0]][a[1]] = null; cross = true;
      acts.push({ r: b[0], c: b[1], color: -1 });
    } else {
      if (isSpecial(ta)) acts.push({ r: b[0], c: b[1], color: isB(tb) ? tb.color : -1 });
      if (isSpecial(tb)) acts.push({ r: a[0], c: a[1], color: isB(ta) ? ta.color : -1 });
    }
    if (!acts.length && !matchAt(g.grid, a[0], a[1]) && !matchAt(g.grid, b[0], b[1])) {
      g.grid[a[0]][a[1]] = ta; g.grid[b[0]][b[1]] = tb;
      return { invalid: true, swapped: [a, b] };
    }
  } else {
    acts.push({ r: a[0], c: a[1], color: -1 });
  }
  g.moves--;
  const steps = resolve(g, acts, b ? [a, b] : [a]);
  g.won = g.goals.every(x => x.left <= 0);
  const gift = g.won ? null : comboGift(g, steps.length);
  let boss = null;
  if (g.boss && !g.won) { boss = bossTurn(g); g.won = g.goals.every(x => x.left <= 0); }
  g.lost = !g.won && g.moves <= 0;
  const shuffled = !g.won && !g.lost ? ensureMove(g) : false;
  return { steps, gift, boss, shuffled, swapped: b ? [a, b] : null, cross };
}

/**
 * Kedi yeteneği. Bir balona uygulanır, hamle harcamaz.
 * targets: kedinin sırayla vurduğu hücreler; recolor: rengi değişen taşlar; steps: ardından gelen zincirler.
 */
function useCat(g, kind, r, c) {
  if (g.won || g.lost || !CATS[kind]) return null;
  if (CATS[kind].target && (!inB(r, c) || !isB(g.grid[r][c]))) return null;
  const t = CATS[kind].target ? g.grid[r][c] : null;
  let targets = t ? [[r, c]] : [], recolor = null, splash = null, steps;
  if (kind === 'golge') {
    const blocks = [], balloons = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (breakable(g.grid[y][x])) blocks.push([y, x]); else if (isB(g.grid[y][x])) balloons.push([y, x]);
    }
    while (targets.length < 8 && blocks.length) targets.push(blocks.splice(rnd(blocks.length), 1)[0]);
    while (targets.length < 8 && balloons.length) targets.push(balloons.splice(rnd(balloons.length), 1)[0]);
    steps = resolve(g, [], [], targets);
  } else if (kind === 'tembel') {
    g.moves += 3;
    steps = [];
  } else if (kind === 'zipzip') {
    const same = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (isB(g.grid[y][x], t.color) && !(y === r && x === c)) same.push([y, x]);
    while (targets.length < 6 && same.length) targets.push(same.splice(rnd(same.length), 1)[0]);
    // son zıplayışta pati darbesi: çevresindeki 4 hücre de patlar
    const [ly, lx] = targets[targets.length - 1];
    splash = [];
    for (const [dy, dx] of N4) {
      const y = ly + dy, x = lx + dx;
      if (inB(y, x) && g.grid[y][x] && g.grid[y][x].kind !== 'lava' && !isVoid(g.grid[y][x]) && !targets.some(q => q[0] === y && q[1] === x)) splash.push([y, x]);
    }
    steps = resolve(g, [], [], targets.concat(splash));
  } else if (kind === 'yumak') {
    for (let d = 1; d < ROWS; d++) for (const [dy, dx] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) {
      const y = r + dy * d, x = c + dx * d;
      if (inB(y, x) && g.grid[y][x] && g.grid[y][x].kind !== 'lava' && !isVoid(g.grid[y][x])) targets.push([y, x]);
    }
    steps = resolve(g, [], [], targets);
  } else if (kind === 'mirmir') {
    recolor = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const y = r + dy, x = c + dx;
      if (inB(y, x) && isB(g.grid[y][x]) && g.grid[y][x].color !== t.color) { g.grid[y][x].color = t.color; recolor.push({ tile: g.grid[y][x], r: y, c: x }); }
    }
    steps = resolve(g, [], []);
  } else return null;
  g.won = g.goals.every(x => x.left <= 0);
  const shuffled = !g.won ? ensureMove(g) : false;
  return { kind, targets, recolor, splash, steps, shuffled };
}

function snapshot(g) {
  const out = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (g.grid[y][x]) out.push({ tile: g.grid[y][x], r: y, c: x });
  return out;
}
function randomBalloons(g, n) {
  const cells = [];
  for (let r = 0; r < ROWS - g.lava; r++) for (let c = 0; c < COLS; c++) if (isB(g.grid[r][c]) && !g.grid[r][c].lock) cells.push([r, c]);
  const out = [];
  while (out.length < n && cells.length) out.push(cells.splice(rnd(cells.length), 1)[0]);
  return out;
}

/**
 * Oyuncunun hamlesinden sonra patronun sırası: korlar yanar, lav yükselir ya da çekilir, patron saldırır.
 * Olayları (arayüz için), olaylardan sonraki tahtayı ve doğan zincir adımlarını döndürür.
 */
function bossTurn(g) {
  const b = g.boss, events = [];
  // su: lav bir sıra çekilir
  if (b.recede) {
    b.recede = false;
    if (g.lava > 0) {
      const row = ROWS - g.lava;
      for (let c = 0; c < COLS; c++) g.grid[row][c] = null;
      g.lava--;
      b.lavaTimer = LAVA_EVERY;
      gravity(g);
      events.push({ type: 'recede' });
    }
  }
  // korlar: süresi biten kor bir hamle yakar
  let burned = false;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = g.grid[r][c];
    if (!t || t.kind !== 'ember') continue;
    if (--t.fuse <= 0) { g.grid[r][c] = null; g.moves = Math.max(0, g.moves - 1); burned = true; events.push({ type: 'burn', r, c }); }
  }
  if (burned) gravity(g);
  if (!b.doom) return stopBossTurn(g, events);
  // can yarıya inince patron öfkelenir: kaya yağar, daha sık saldırır
  if (!b.rage && b.hp <= b.max / 2) {
    b.rage = true; b.every = 2; b.timer = Math.min(b.timer, 2);
    const cells = randomBalloons(g, 4);
    for (const [r, c] of cells) g.grid[r][c] = { id: _id++, kind: 'ash', color: -1 };
    events.push({ type: 'rage', cells });
  }
  // lav yükselir
  if (--b.lavaTimer <= 0) {
    b.lavaTimer = LAVA_EVERY;
    if (g.lava < MAX_LAVA) {
      const row = ROWS - 1 - g.lava;
      for (let c = 0; c < COLS; c++) g.grid[row][c] = { id: _id++, kind: 'lava', color: -1 };
      g.lava++;
      events.push({ type: 'lava', row });
    }
  }
  // saldırı: kor, kül, deprem sırayla
  if (--b.timer <= 0) {
    b.timer = b.every;
    const kind = ['ember', 'ash', 'quake'][b.n++ % 3];
    if (kind === 'ember') {
      const cells = randomBalloons(g, b.rage ? 2 : 1);
      for (const [r, c] of cells) g.grid[r][c] = { id: _id++, kind: 'ember', color: -1, fuse: EMBER_FUSE };
      events.push({ type: 'ember', cells });
    } else if (kind === 'ash') {
      const cells = randomBalloons(g, 3);
      for (const [r, c] of cells) g.grid[r][c] = { id: _id++, kind: 'ash', color: -1 };
      events.push({ type: 'ash', cells });
    } else {
      const row = rnd(ROWS - g.lava);
      g.grid[row].unshift(g.grid[row].pop());     // sıra bir hücre sağa kayar
      events.push({ type: 'quake', row });
    }
  }
  const rescued = settleBoard(g).rescued;          // lav yükselince alta inen yavrular
  const layout = snapshot(g);
  const steps = resolve(g, [], []);                // kaymadan ve düşüşten doğan eşleşmeler
  return { events, layout, rescued, steps, timer: b.timer, lavaTimer: b.lavaTimer };
}

/** Yerçekimi; en alta inen yavru kediler kurtarılır, yerleri dolar. Tekrar eder. */
function settleBoard(g) {
  let spawned = gravity(g);
  const rescued = [];
  for (let guard = 0; guard < 10; guard++) {
    let found = false;
    for (let c = 0; c < COLS; c++) {
      let bottom = ROWS - 1 - (g.lava || 0);
      while (bottom > 0 && isVoid(g.grid[bottom][c])) bottom--;
      const t = g.grid[bottom][c];
      if (!t || t.kind !== 'kitten') continue;
      rescued.push({ tile: t, r: bottom, c });
      g.grid[bottom][c] = null;
      for (const goal of g.goals) if (goal.type === 'kitten' && goal.left > 0) goal.left--;
      found = true;
    }
    if (!found) break;
    spawned = spawned.concat(gravity(g));
  }
  return { spawned, rescued };
}

/** Boss durağındaki boss'un sırası: yarı canda öfkelenir, her saldırıda hilesini yapar. */
function stopBossTurn(g, events) {
  const b = g.boss;
  if (!b.rage && b.hp <= b.max / 2) {
    b.rage = true; b.every = 2; b.timer = Math.min(b.timer, 1);
    events.push({ type: 'rage' });
  }
  if (--b.timer <= 0) {
    b.timer = b.every;
    const kind = b.trick === 'all' ? ['freeze', 'lock', 'crate', 'quake', 'mix'][b.n % 5] : b.trick;
    b.n++;
    const n = b.rage ? 4 : 3;
    if (kind === 'quake') {
      const row = rnd(ROWS);
      g.grid[row].unshift(g.grid[row].pop());
      events.push({ type: 'quake', row });
    } else {
      const cells = randomBalloons(g, kind === 'mix' ? n + 2 : n);
      for (const [r, c] of cells) {
        const t = g.grid[r][c];
        if (kind === 'freeze') g.grid[r][c] = { id: _id++, kind: 'ice', color: -1, hp: 2 };
        else if (kind === 'crate') g.grid[r][c] = { id: _id++, kind: 'crate', color: -1 };
        else if (kind === 'lock') t.lock = true;
        else if (kind === 'mix') t.color = b.resist;
      }
      events.push({ type: kind, cells });
    }
  }
  const rescued = settleBoard(g).rescued;
  const layout = snapshot(g);
  const steps = resolve(g, [], []);
  return { events, layout, rescued, steps, timer: b.timer, lavaTimer: b.lavaTimer };
}

/** Hedeflerde kalan toplam. */
function goalLeft(g) { return g.goals.reduce((a, x) => a + Math.max(0, x.left), 0); }
/** Otomatik oyuncu: çoğunlukla en çok ilerleten hamleyi, bazen rastgele birini seçer. */
function botPick(g, skill) {
  const ms = listMoves(g);
  if (!ms.length) return null;
  if (Math.random() > (skill === undefined ? 0.8 : skill)) return ms[rnd(ms.length)];
  const kitDepth = gg => { let s = 0; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (gg.grid[r][c] && gg.grid[r][c].kind === 'kitten') s += r; return s; };
  const hasKit = g.goals.some(x => x.type === 'kitten' && x.left > 0);
  let best = null, bs = -1e9;
  for (const m of ms) {
    const cg = cloneGame(g), before = goalLeft(cg), kd = hasKit ? kitDepth(cg) : 0;
    const r = move(cg, m[0], m[1]);
    let s = before - goalLeft(cg) + 0.4 * r.steps.reduce((a, st) => a + st.created.length, 0) + Math.random() * 0.2;
    if (hasKit) s += 0.5 * (kitDepth(cg) - kd);
    if (cg.won) s += 1000;
    if (s > bs) { bs = s; best = m; }
  }
  return best;
}
/** Bir bölümü n kez otomatik oynatır: kazanma oranı ve ortalama yıldız. */
function simulate(level, n, skill) {
  let won = 0, stars = 0;
  const scores = [];
  for (let k = 0; k < n; k++) {
    const g = createGame(level);
    let guard = 0;
    while (!g.won && !g.lost && guard++ < 200) { const m = botPick(g, skill); if (!m) break; move(g, m[0], m[1]); }
    if (g.won) { finale(g); won++; stars += starsFor(g); scores.push(g.score); }
  }
  return { win: won / n, stars: won ? stars / won : 0, scores };
}

/** Taşlar aşağı düşer, boşalan yerlere üstten yeni balon gelir. */
function gravity(g) {
  const spawned = [];
  for (let c = 0; c < COLS; c++) {
    // sütunun oynanan hücreleri, aşağıdan yukarıya (boşluklar ve lav sıraları atlanır)
    const cells = [];
    for (let r = ROWS - 1 - (g.lava || 0); r >= 0; r--) if (!isVoid(g.grid[r][c])) cells.push(r);
    const tiles = [];
    for (const r of cells) { if (g.grid[r][c]) tiles.push(g.grid[r][c]); g.grid[r][c] = null; }
    let k = 0;
    cells.forEach((r, n) => {
      if (n < tiles.length) { g.grid[r][c] = tiles[n]; return; }
      const below = n > 0 ? g.grid[cells[n - 1]][c] : null;
      const color = isB(below) && Math.random() < SPAWN_LUCK ? below.color : rnd(g.level.colors);
      const t = { id: _id++, kind: 'b', color };
      g.grid[r][c] = t;
      spawned.push({ tile: t, c, from: -(++k) });
    });
  }
  return spawned;
}

/** Yapılabilecek tüm hamleler: [[r,c],[r,c]] çiftleri. */
function listMoves(g, firstOnly) {
  const out = [], grid = g.grid;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = grid[r][c];
    if (!canSwap(t)) continue;
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (!inB(r2, c2)) continue;
      const u = grid[r2][c2];
      if (!canSwap(u)) continue;
      let ok = isSpecial(t) || isSpecial(u);
      if (!ok) {
        grid[r][c] = u; grid[r2][c2] = t;
        ok = matchAt(grid, r, c) || matchAt(grid, r2, c2);
        grid[r][c] = t; grid[r2][c2] = u;
      }
      if (ok) { out.push([[r, c], [r2, c2]]); if (firstOnly) return out; }
    }
  }
  return out;
}

/** Hamle kalmadıysa balonların renklerini (eşleşme oluşturmadan) karıştırır. Karıştırdıysa true. */
function ensureMove(g) {
  let shuffled = false, guard = 0;
  while (!listMoves(g, true).length && guard++ < 300) {
    shuffled = true;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const t = g.grid[r][c];
      if (isB(t)) { t.color = -2; t.color = safeColor(g.grid, r, c, g.level.colors); }
    }
  }
  return shuffled;
}

/** Yıldızlar puandan gelir: kazanınca en az 1; puan eşiklerini geçtikçe 2 ve 3. */
function starsFor(g) {
  if (!g.won) return 0;
  const t = g.level.stars;
  if (!t) return g.moves >= 5 ? 3 : g.moves >= 2 ? 2 : 1;
  return g.score >= t[2] ? 3 : g.score >= t[1] ? 2 : 1;
}

const MAP_W = 360, STEP = 150, MAP_TOP = 250, MAP_BOTTOM = 120, SEG = 24;
const MAP_H = MAP_TOP + MAP_BOTTOM + (LEVELS.length - 1) * STEP;
function nodePos(i) { return { x: 180 + 92 * Math.sin(i * 1.9 + 0.6), y: MAP_H - MAP_BOTTOM - i * STEP }; }
let samples = [], marker = null;
function nodeSample(i) { return (i + 1) * SEG; }

/** Durakların içinden geçen yumuşak yol: eğri parçaları ve üzerindeki örnek noktalar. */
function buildRoad() {
  const pts = [{ x: nodePos(0).x - 50, y: MAP_H + 30 }];
  for (let i = 0; i < LEVELS.length; i++) pts.push(nodePos(i));
  pts.push({ x: 180, y: 150 });
  let d = 'M' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
  samples = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
    const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
    d += ' C' + [c1.x, c1.y, c2.x, c2.y, p2.x, p2.y].map(v => v.toFixed(1)).join(' ');
    for (let k = 1; k <= SEG; k++) {
      const t = k / SEG, u = 1 - t;
      samples.push({
        x: u * u * u * p1.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * p2.x,
        y: u * u * u * p1.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * p2.y,
      });
    }
  }
  return d;
}
function seeded(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    const t0 = performance.now(), dur = 1700;

      setMarker(pos, q.x < p.x);
      scrollToY(pos.y);
      const step = Math.floor(f / 4);
      if (step !== lastStep) {
        lastStep = step;
        beep(500 + (step % 5) * 60, 0.05, 'triangle', 0.05);

const fx = { items: [], running: false, last: 0, ctx: null, dpr: 1 };

function fxAdd(p) {

}
function fxTick(now) {

function drawShard(ctx, p, k, dt) {

    fxAdd({ x: o.x, y: o.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - cell * 2, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 16, size: cell * (0.1 + Math.random() * 0.1), color, life: 0.4 + Math.random() * 0.25, draw: drawShard });
  }

}
function drawRing(ctx, p, k) {

}

function tileClass(t) {

  if (t.kind === 'crate' || t.kind === 'ash' || t.kind === 'lava' || t.kind === 'ember' || t.kind === 'kitten') return 'inner ' + t.kind;
  if (t.kind === 'ice') return 'inner ice' + (t.hp === 1 ? ' cracked' : '');

}
function makeEl(t) {
  const el = document.createElement('div');
  el.className = 'tile now';
  const inner = document.createElement('div');
  inner.className = tileClass(t);
  if (t.kind === 'ember') inner.dataset.fuse = t.fuse;
  if (t.kind === 'kitten') inner.style.backgroundImage = catBg('yavru', false);
