}
function place(el, r, c) { el._r = r; el._c = c; el.style.transform = 'translate(' + c * cell + 'px,' + r * cell + 'px)'; }
function elAt(r, c) { const t = game.grid[r][c]; return t ? els.get(t.id) : null; }

/** Bir taşı yerçekimiyle yeni hücresine düşürür; süreyi (ms) döndürür. */
function fall(el, r, c, delay) {
  const dist = Math.max(0, r - el._r);
  const dur = dist ? Math.min(560, 170 + dist * 55) : 180;
  el.classList.remove('now');
  const from = el._r;
  // yol boşluk (şekil dışı) hücreden geçiyorsa: balon orada görünmez, kenardan süzülüp çıkar
  const open = y => { const yy = Math.max(0, Math.min(ROWS - 1, Math.round(y))); return !isVoid(game.grid[yy][c]); };
  let gap = false;
  for (let y = Math.floor(from); y <= r; y++) if (!open(y)) { gap = true; break; }
  if (dist && gap && el.animate) {
    for (const a of el.getAnimations()) a.cancel();
    el.style.transitionDuration = '0ms';
    el.style.transitionDelay = '0ms';
    const frames = [];
    const steps = Math.ceil(r - from);
    for (let i = 0; i <= steps; i++) {
      const y = Math.min(r, from + i);
      frames.push({ offset: (y - from) / (r - from), transform: 'translate(' + c * cell + 'px,' + y * cell + 'px)', opacity: open(y) ? 1 : 0 });
    }
    if (frames[frames.length - 1].offset < 1) frames.push({ offset: 1, transform: 'translate(' + c * cell + 'px,' + r * cell + 'px)', opacity: 1 });
    frames[frames.length - 1].opacity = 1;
    place(el, r, c);
    el.animate(frames, { duration: dur, delay: delay || 0, easing: 'cubic-bezier(0.45, 0, 0.85, 0.65)', fill: 'backwards' });
    setTimeout(() => flash(el, 'land', 230), dur + (delay || 0) - 20);
    return dur + (delay || 0);
  }
  el.style.transitionDuration = dur + 'ms';
  el.style.transitionTimingFunction = dist ? 'cubic-bezier(0.45, 0, 0.85, 0.65)' : '';
  el.style.transitionDelay = (delay || 0) + 'ms';
  place(el, r, c);
  if (dist) setTimeout(() => flash(el, 'land', 230), dur + (delay || 0) - 20);
  return dur + (delay || 0);
}
function resetMotion(el) { el.style.transitionDuration = ''; el.style.transitionTimingFunction = ''; el.style.transitionDelay = ''; }

function layoutNow() {

/** Tahtanın zemini: yalnızca oynanan hücreler çizilir, kenarlarına çizgi çekilir. */
function drawBoardBg() {
  const layer = $('#bgLayer');
  if (!layer || !game) return;
  const live = (r, c) => inB(r, c) && !isVoid(game.grid[r][c]);
  let html = '';
  const ink = 'var(--ink)', w = 3;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!live(r, c)) continue;
    const sh = [];
    if (!live(r - 1, c)) sh.push('inset 0 ' + w + 'px 0 ' + ink);
    if (!live(r + 1, c)) sh.push('inset 0 -' + w + 'px 0 ' + ink);
    if (!live(r, c - 1)) sh.push('inset ' + w + 'px 0 0 ' + ink);
    if (!live(r, c + 1)) sh.push('inset -' + w + 'px 0 0 ' + ink);
    const rad = [!live(r - 1, c) && !live(r, c - 1), !live(r - 1, c) && !live(r, c + 1), !live(r + 1, c) && !live(r, c + 1), !live(r + 1, c) && !live(r, c - 1)].map(x => (x ? '12px' : '0')).join(' ');
    html += '<div class="bgc' + ((r + c) % 2 ? ' alt' : '') + '" style="transform:translate(' + c * cell + 'px,' + r * cell + 'px);box-shadow:' + (sh.join(',') || 'none') + ';border-radius:' + rad + '"></div>';

    if (!game || busy || game.won || game.lost) return;
    const m = listMoves(game, true)[0];
    if (!m) return;
    const [a, b] = m, ea = elAt(a[0], a[1]), eb = elAt(b[0], b[1]);

    eb.style.setProperty('--hx', (a[1] - b[1]) * 16 + '%'); eb.style.setProperty('--hy', (a[0] - b[0]) * 16 + '%');

function setSelected(rc) {

// ---- girdi: kaydır, ya da önce bir balona sonra komşusuna dokun
function cellFrom(ev) {
  const rect = board.getBoundingClientRect();
  return [Math.floor((ev.clientY - rect.top) / cell), Math.floor((ev.clientX - rect.left) / cell)];
}
function onDown(ev) {
  if (!game || busy) return;
  const [r, c] = cellFrom(ev);
  if (!inB(r, c)) return;
  clearHint();
  if (aim) { if (!demo || isB(game.grid[r][c])) runCat(aim, r, c); return; }
  if (demo) return;                       // gösteri sırasında yalnızca kedi düğmesi ve balon seçimi
  drag = { r, c, x: ev.clientX, y: ev.clientY };
  try { board.setPointerCapture(ev.pointerId); } catch (e) { /* yok say */ }
}
function onMove(ev) {
  if (!drag || busy) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < cell * 0.32) return;
  const to = Math.abs(dx) > Math.abs(dy) ? [drag.r, drag.c + Math.sign(dx)] : [drag.r + Math.sign(dy), drag.c];
  const from = [drag.r, drag.c];
  drag = null;
  setSelected(null);
  if (inB(to[0], to[1])) attempt(from, to); else armHint();
}
function onUp() {
  if (!drag || busy) { drag = null; return; }
  const here = [drag.r, drag.c];
  drag = null;
  const t = game.grid[here[0]][here[1]];
  if (selected && Math.abs(selected[0] - here[0]) + Math.abs(selected[1] - here[1]) === 1) {
    const from = selected;
    setSelected(null);
    attempt(from, here);
  } else if (isSpecial(t) && selected && selected[0] === here[0] && selected[1] === here[1]) {
    setSelected(null);
    attempt(here, null);            // seçili özel taşa ikinci dokunuş: patlat
  } else if (canSwap(t)) {
    setSelected(here);
    beep(700, 0.04, 'sine', 0.05);
    armHint();
  }
}

    place(elA, a[0], a[1]); place(elB, b[0], b[1]);
    flash(elA, 'nope', 260); flash(elB, 'nope', 260);
    await wait(230);
    busy = false;
    armHint();
    return;
  }
  $('#moves').textContent = game.moves;
  let combo = 0;
  for (const step of res.steps) {
    combo++;
    if (combo >= 2) { $('#comboNow').textContent = 'x' + combo; flash($('#combo'), 'bump', 320); fxText(ROWS / 2 - 0.5, COLS / 2 - 0.5, 'x' + combo, '#ffcf3f', cell * (0.9 + Math.min(combo, 6) * 0.22), 0.9); }
    await playStep(step, combo);
  }
  if (combo >= 2) {
    // kombo: bu oyunun en iyisi ve durağın rekoru
    playBest = Math.max(playBest, combo);
    const record = !testMode && combo > save.combo[levelIndex];
    if (record) { save.combo[levelIndex] = combo; storeSave(); }
    say(record ? 'Yeni rekor! ' + combo + ' kombo' : ['', '', 'Aferin!', 'Harikasın!', 'Süpersin!', 'Efsanesin!'][Math.min(combo, 5)] + ' ' + combo + ' kombo · rekor x' + save.combo[levelIndex], true);
    if (record) beep(1047, 0.3, 'triangle', 0.14, 1.5);
  }
  $('#comboNow').textContent = 'x' + playBest;
  $('#comboBest').textContent = 'rekor x' + save.combo[levelIndex];
  if (res.gift) await playGift(res.gift, combo);
  if (res.boss) await playBoss(res.boss);
  await settle(res, combo);
}

/** Hamle ya da kedi sonrası: karıştırma, final şovu, bölüm sonu. */
/** Uzun zincir hediyesi: bir balon parlayıp özel taşa dönüşür. */
async function playGift(gift, combo) {
  const old = els.get(gift.old.id);
  if (old) { els.delete(gift.old.id); old.classList.add('pop'); setTimeout(() => old.remove(), 230); }
  const el = makeEl(gift.tile);
  place(el, gift.r, gift.c);
  el.classList.remove('now');
  flash(el, 'born', 440);
  fxRing(gift.r, gift.c, '#ffcf3f', cell * 1.6, 0.7, 7); fxStars(gift.r, gift.c, '#ffe94d', 14);
  beep(988, 0.3, 'triangle', 0.12, 1.4);
  const name = { rocketH: 'roket', rocketV: 'roket', rocketX: 'artı roket', giant: 'dev kedi', bomb: 'bomba', rainbow: 'gökkuşağı' }[gift.tile.kind];
  say(combo + ' kombo hediyesi: ' + name + '!', true);
  await wait(500);
}

async function settle(res, combo) {
  if (res.shuffled) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const t = game.grid[r][c], el = t && els.get(t.id);
      if (el) { el.firstChild.className = tileClass(t); flash(el, 'born', 440); }
    }
    say('Hamle kalmadı, balonlar karıştırıldı');
    await wait(380);
  }
  renderHud();
  if (game.won) {
    // final şovu: kullanılmamış özel taşlar patlar, kalan hamleler puana döner; "Geç" ile atlanabilir
    const movesLeft = game.moves, before = shownScore;
    const fin = finale(game);
    finaleInfo = fin;
    const showy = fin.steps.length || movesLeft > 0;
    if (showy) { skipFinale = false; $('#skipBtn').hidden = false; }
    if (fin.steps.length) {
      say('Final şovu! Kalan özel taşlar patlıyor', true);
      await wait(500);
      let n = combo;
      for (const step of fin.steps) { if (skipFinale) break; n++; await playStep(step, n); }
      if (!skipFinale) await wait(250);
    }
    if (movesLeft > 0 && !skipFinale) {
      say('Kalan hamleler puana dönüşüyor!', true);
      const gap = Math.max(60, Math.min(160, 1800 / movesLeft));
      for (let m = movesLeft - 1; m >= 0 && !skipFinale; m--) {
        $('#moves').textContent = m;
        const r = rnd(ROWS), c = rnd(COLS);
        fxStars(r, c, '#ffe94d', 6);
        addScore(SCORE.finaleMove, r, c, true);
        beep(660 + (movesLeft - m) * 25, 0.07, 'square', 0.05, 1.2);
        await wait(gap);
      }
      if (!skipFinale) await wait(300);
    }
    $('#skipBtn').hidden = true;
    if (skipFinale) {
      // atlandı: tahtayı son hâline getir, kazanılanları tek kartta göster
      els.forEach(el => el.remove()); els.clear(); fx.items = [];
      layoutNow();
      $('#moves').textContent = 0;
      const specialPts = fin.steps.reduce((a, st) => a + st.score, 0) + fin.fired * SCORE.finaleSpecial;
      const box = $('#finalSum');
      box.innerHTML = '<b>Final bonusu</b>' +
        (fin.fired ? '<div><span>' + fin.fired + ' özel taş</span><span>+' + fmt(specialPts) + '</span></div>' : '') +
        (movesLeft ? '<div><span>' + movesLeft + ' kalan hamle</span><span>+' + fmt(movesLeft * SCORE.finaleMove) + '</span></div>' : '') +
        '<div class="total"><span>Toplam puan</span><span>' + fmt(game.score) + '</span></div>';
      box.hidden = false;
      shownScore = game.score;
      renderScore(true);
      beep(988, 0.3, 'triangle', 0.12, 1.3);
      await new Promise(res => setTimeout(res, 1700));
      box.hidden = true;
    } else {
      if (fin.fired) addScore(fin.fired * SCORE.finaleSpecial, ROWS / 2, COLS / 2 - 0.5, true);
      shownScore = game.score;
      renderScore(true);
    }
  }
  busy = false;
  if (game.won || game.lost) { finish(); return; }
  armHint();
  // hamle azalınca kedi üzülür ve yardım önerir
  if (game.moves !== lowWarned && (game.moves === 5 || game.moves === 2)) {
    lowWarned = game.moves;
    const haveCat = Object.keys(CATS).some(k => catOpen(k) && save.cats[k] > 0);
    const line = game.moves === 5 ? 'Az hamle kaldı, dikkatli oyna' : haveCat ? 'Son 2 hamle! Aşağıdaki kedilerden yardım iste' : 'Son 2 hamle… hadi, yaparsın';
    setTimeout(() => { if (game && !busy && !game.won && !game.lost) say(line, false, 'sad'); }, combo >= 2 ? 1500 : 0);
  }
}

// ---- kediler: alttaki çubuktan seçilir, bir balona dokununca çalışır
function renderCatBar() {
  const bar = $('#catbar');
  bar.hidden = !Object.keys(CATS).some(catOpen);
  bar.innerHTML = '';
  for (const key in CATS) {
    if (!catOpen(key)) continue;
    const isDemo = demo && demo.key === key;
    const btn = document.createElement('button');
    btn.className = 'catbtn' + (save.cats[key] <= 0 && !isDemo ? ' empty' : '') + (aim === key ? ' aim' : '') + (isDemo && !aim ? ' pulse' : '');
    btn.disabled = !!demo && !isDemo;
    btn.setAttribute('aria-label', CATS[key].name + ', ' + save.cats[key] + ' adet. ' + CATS[key].info);
    btn.innerHTML = '<span class="pix" style="background-image:' + catBg(key, aim === key) + '"></span><em>' + (isDemo ? '★' : save.cats[key]) + '</em>';
    btn.addEventListener('click', () => {
      if (!game || busy) return;
      if (save.cats[key] <= 0 && !isDemo) { say(CATS[key].name + ' kalmadı. Elmasla yenisini alabilirsin', false, 'sad'); openShop(); return; }
      if (!CATS[key].target) { aim = null; runCat(key, -1, -1); return; }
      if (isDemo) {
        if (aim) return;
        aim = key;
        meow();
        const [r, c] = demo.cell, el = elAt(r, c);
        if (el) el.classList.add('pick');
        say('Şimdi parlayan balona dokun', false, null, true);
      } else {
        aim = aim === key ? null : key;
        if (aim) { meow(); say(CATS[key].name + ' hazır. ' + CATS[key].how); }
      }
      setSelected(null);
      renderCatBar();
    });
    bar.appendChild(btn);
  }
}

/** Sıradaki gösteri: bu durakta ilk kez tanıtılacak kedi varsa oyuncuya uygulamalı denetir. */
function startDemo(i) {
  let key = null;
  for (const k in CATS) if (!save.demo[k] && CATS[k].demoAt <= i) { key = k; break; }
  if (!key) return;
  clearHint();
  // gösteri için uygun bir balon: tahtanın ortasına en yakın balon
  let cellPick = null, best = 99;
  const midR = (ROWS - (game.level.crateRows || 0)) / 2 - 0.5;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const d = Math.abs(r - midR) + Math.abs(c - 3);
    if (isB(game.grid[r][c]) && d < best) { best = d; cellPick = [r, c]; }
  }
  giveCat(key);
  demo = { key, cell: cellPick };
  renderCatBar();
  say('Yeni dostun ' + CATS[key].name + '! Parlayan kediye bas, deneme bedava', false, null, true);
  meow();
}

/** Kedinin adı ve resmi tahtanın ortasından şerit hâlinde geçer. */
async function cutIn(kind) {
  const band = document.createElement('div');
  band.className = 'cutin';
  band.innerHTML = '<span class="pix" style="background-image:' + catBg(kind, true) + '"></span><b>' + CATS[kind].name.toLocaleUpperCase('tr') + '!<small>' + CATS[kind].title + '</small></b>';
  board.appendChild(band);
  beep(523, 0.12, 'square', 0.08, 1); setTimeout(() => beep(784, 0.25, 'square', 0.08, 1.2), 120);
  await wait(950);
  band.remove();
}

async function runCat(kind, r, c) {
  const isDemo = !!demo && demo.key === kind;
  const res = useCat(game, kind, r, c);
  if (!res) { say('Kedi yalnızca balona gider: bir balona dokun'); renderCatBar(); return; }
  if (c < 0) { c = 3; r = 4; }
  busy = true; aim = null;
  board.querySelectorAll('.pick').forEach(el => el.classList.remove('pick'));
  if (isDemo) { save.demo[kind] = true; demo = null; } else save.cats[kind]--;
  storeSave();
  renderCatBar();
  setSelected(null);
  clearHint();
  $('#strip').classList.remove('on');
  await cutIn(kind);

  const cat = document.createElement('div');
  cat.className = 'cat-run';
  cat.innerHTML = '<span class="pix"></span>';
  const face = wave => { cat.firstChild.style.backgroundImage = catBg(kind, wave); };
  face(false);
  const moveTo = (y, x, ms) => { cat.style.transitionDuration = ms + 'ms'; cat.style.transform = 'translate(' + x * cell + 'px,' + (y - 0.3) * cell + 'px)'; };
  const jump = (y, x, ms) => { moveTo(y, x, ms); cat.firstChild.style.animationDuration = ms + 'ms'; flash(cat.firstChild, 'jump', ms); };
  cat.style.transform = 'translate(' + c * cell + 'px,' + ROWS * cell + 'px)';
  board.appendChild(cat);
  void cat.offsetWidth;
  meow();

  const first = res.steps[0];
  const at = new Map();
  if (first) for (const p of first.popped) at.set(p.r * COLS + p.c, p);
  const hit = (y, x) => {
    const p = at.get(y * COLS + x), el = p && els.get(p.tile.id);
    if (!el) return;
    els.delete(p.tile.id);
    el.remove();
    fxPixels(y, x, p.tile.kind === 'b' ? COLOR_HEX[p.tile.color] : p.tile.kind === 'ember' ? '#ff7a1a' : p.tile.kind === 'ash' ? '#b9b4c4' : '#c9a36a');
    fxRing(y, x, '#ffffff', cell * 0.7, 0.3, 3);
  };

  if (kind === 'zipzip') {
    let n = 0;
    for (const [y, x] of res.targets) {
      jump(y, x, 300); await wait(300);
      n++;
      hit(y, x);
      fxText(y - 0.5, x, String(n), '#ffffff', cell * 0.6, 0.7);
      beep(SCALE[Math.min(n, SCALE.length - 1)], 0.14, 'square', 0.07, 0.9);
      await wait(130);
    }
    // son pati darbesi
    const [ly, lx] = res.targets[res.targets.length - 1];
    face(true);
    fxRing(ly, lx, '#ffcf3f', cell * 1.7, 0.5, 8); fxStars(ly, lx, '#ffe94d', 12);
    for (const [y, x] of res.splash || []) hit(y, x);
    beep(200, 0.3, 'sawtooth', 0.12, 0.4); buzz(40);
    if (!reduced) flash(board, 'shake', 340);
    await wait(420);
  } else if (kind === 'yumak') {
    jump(r, c, 320); await wait(340);
    face(true);
    hit(r, c);
    const far = res.targets.reduce((m, q) => Math.max(m, Math.abs(q[0] - r)), 0);
    for (const [dy, dx] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) fxYarn(r, c, dy, dx, far, 0.11);
    beep(600, 0.12, 'triangle', 0.08, 1.3);
    for (let d = 1; d <= far; d++) {
      await wait(110);
      for (const [y, x] of res.targets) if (Math.abs(y - r) === d) hit(y, x);
      beep(700 + d * 70, 0.07, 'square', 0.05, 0.8);
    }
    await wait(300);
  } else if (kind === 'mirmir') {
    jump(r, c, 320); await wait(340);
    face(true);
    for (let i = 0; i < 3; i++) {
      fxRing(r, c, i % 2 ? '#ffffff' : '#c9a8ff', cell * (1.6 + i * 0.5), 0.8, 7);
      fxText(r - 0.4 + Math.random() * 0.4, c - 0.6 + Math.random() * 1.2, '♥', '#ff7ac8', cell * 0.5, 0.9);
      beep(95 + i * 8, 0.3, 'sawtooth', 0.07, 1.05);
      await wait(260);
    }
    for (const it of res.recolor) {
      const el = els.get(it.tile.id);
      if (el) { el.firstChild.className = tileClass(it.tile); flash(el, 'born', 440); fxStars(it.r, it.c, COLOR_HEX[it.tile.color], 6); }
      beep(800 + Math.random() * 300, 0.06, 'triangle', 0.06, 1.2);
      await wait(110);
    }
    await wait(350);
  } else if (kind === 'golge') {
    const shade = document.createElement('div');
    shade.className = 'shade';
    board.appendChild(shade);
    await wait(260);
    for (const [y, x] of res.targets) {
      moveTo(y, x, 70); face(true);
      await wait(90);
      fxSlash(y, x); hit(y, x);
      beep(1500, 0.07, 'sawtooth', 0.07, 0.3); buzz(15);
      await wait(150);
    }
    shade.classList.add('out');
    setTimeout(() => shade.remove(), 300);
    await wait(200);
  } else if (kind === 'tembel') {
    // Paşa ağır ağır yürür, yastığına kıvrılır; gece çöker, rüyasında kum saati geri döner,
    // her horlamada bir ay ışığı hamle sayacına uçar
    moveTo(r, c, 900); await wait(950);
    fxText(r - 0.7, c + 0.1, 'Haaav~', '#fff3c4', cell * 0.42, 1.1);
    beep(260, 0.5, 'sine', 0.08, 0.6);
    await wait(520);
    cat.classList.add('sleep');
    const night = document.createElement('div');
    night.className = 'shade night';
    night.innerHTML = '<span class="moon"></span>';
    board.appendChild(night);
    const dream = document.createElement('div');
    dream.className = 'dream';
    dream.style.transform = 'translate(' + (c + 0.55) * cell + 'px,' + (r - 1.9) * cell + 'px)';
    dream.innerHTML = '<i></i><i></i><b><span class="glass">⏳</span></b>';
    board.appendChild(dream);
    for (let k = 0; k < 6; k++) setTimeout(() => fxStars(Math.random() * ROWS * 0.6, Math.random() * COLS, '#fff3c4', 3), k * 140);
    await wait(500);
    const box = $('#movesBox');
    for (let i = 0; i < 3; i++) {
      fxText(r - 0.5 - i * 0.25, c + 0.45 + i * 0.25, 'Z', '#cfe4ff', cell * (0.4 + i * 0.12), 1.1);
      beep(150 - i * 12, 0.45, 'sine', 0.1, 0.7);
      const from = cat.getBoundingClientRect(), to = box.getBoundingClientRect();
      const orb = document.createElement('div');
      orb.className = 'moon-orb';
      orb.textContent = '+1';
      orb.style.left = (from.left + from.width / 2) + 'px';
      orb.style.top = (from.top + from.height * 0.3) + 'px';
      document.body.appendChild(orb);
      void orb.offsetWidth;
      orb.style.transform = 'translate(' + (to.left + to.width / 2 - from.left - from.width / 2) + 'px,' + (to.top + to.height / 2 - from.top - from.height * 0.3) + 'px) scale(0.6)';
      await wait(620);
      orb.remove();
      $('#moves').textContent = game.moves - 2 + i;
      flash(box, 'bump', 320);
      beep(660 + i * 120, 0.18, 'triangle', 0.09, 1.2);
      await wait(260);
    }
    // sabah: gerinir, uyanır
    night.classList.add('out'); dream.classList.add('out');
    setTimeout(() => { night.remove(); dream.remove(); }, 320);
    cat.classList.remove('sleep');
    face(true);
    jump(r, c, 360);
    fxText(r - 0.8, c, 'Mırr!', '#ffe94d', cell * 0.5, 0.8);
    beep(523, 0.1, 'square', 0.07, 1); setTimeout(() => beep(784, 0.18, 'square', 0.07, 1.2), 110);
    $('#movesBox').classList.toggle('low', game.moves <= 3);
    await wait(450);
  }
  moveTo(ROWS + 0.6, c, 260);
  setTimeout(() => cat.remove(), 320);
  let n = 0;
  for (const step of res.steps) await playStep(step, ++n);
  if (isDemo) say(CATS[kind].after + ' +1 hediye!');
  else if (kind === 'tembel') say('Paşa zamanı geri sardı: +3 hamle', true);
  await settle(res, isDemo ? 0 : n);
}

/** Bir zincir adımını canlandırır: özel taş efekti, patlama, yeni taşlar, düşüş. */
async function playStep(step, combo) {
  // 1) özel taşlar
  let origin = null;
  for (const bl of step.blasts) {
    origin = origin || bl;
    if (bl.kind === 'rocketH') fxLightning(bl.r, bl.c, true);
    else if (bl.kind === 'rocketV') fxLightning(bl.r, bl.c, false);
    else if (bl.kind === 'giant') { for (const [y, x] of [[bl.r, bl.c]]) { fxLightning(y, x, true); fxLightning(y, x, false); } fxDebris(bl.r, bl.c); }
    else if (bl.kind === 'rocketX') { fxLightning(bl.r, bl.c, true); fxLightning(bl.r, bl.c, false); fxRing(bl.r, bl.c, '#ffe94d', cell * 1.5, 0.45, 8); }
    else if (bl.kind === 'bomb') {
      fxRing(bl.r, bl.c, '#ffcf3f', cell * 3, 0.7, 12); fxRing(bl.r, bl.c, '#ffffff', cell * 2, 0.5, 7);
      setTimeout(() => fxRing(bl.r, bl.c, '#ff7a1a', cell * 3.6, 0.7, 6), 160);
      fxDebris(bl.r, bl.c);
      if (!reduced) flash($('#game'), 'shake', 470);     // bütün ekran sarsılır
    }
    else if (bl.kind === 'rainbow') {
      fxRing(bl.r, bl.c, '#ffffff', cell * 1.8, 0.6, 7); fxFlash('#ffffff', 0.25);
      for (const p of step.popped) if (p.tile.kind === 'b' && p.tile.color === bl.color) fxZap([bl.r, bl.c], [p.r, p.c], COLOR_HEX[bl.color]);
    }
  }
  if (step.blasts.length) {
    const kind = step.blasts[0].kind;
    if (kind === 'bomb') beep(110, 0.45, 'sawtooth', 0.2, 0.3);
    else if (kind === 'rainbow') beep(400, 0.5, 'triangle', 0.14, 3);
    else { beep(1400, 0.08, 'square', 0.07, 0.4); setTimeout(() => beep(700, 0.25, 'sawtooth', 0.09, 0.3), 60); }
    buzz(kind === 'bomb' ? 90 : 45);
    await wait(kind === 'bomb' ? 300 : 260);
  } else {
    beep(SCALE[Math.min(combo - 1, SCALE.length - 1)], 0.16, 'sine', 0.15, 0.8);
    buzz(10);
  }
  // 2) patlat: özel taşa dönüşen eşleşme merkezde toplanır, diğerleri parçalanır
  let maxDelay = 0;
  for (const p of step.popped) {
    const el = els.get(p.tile.id);
    els.delete(p.tile.id);
    if (!el) continue;
    const delay = origin ? Math.min(460, (Math.abs(p.r - origin.r) + Math.abs(p.c - origin.c)) * 42) : 0;
    maxDelay = Math.max(maxDelay, delay);
    setTimeout(() => {
      if (p.to) { el.classList.add('merge'); place(el, p.to[0], p.to[1]); setTimeout(() => el.remove(), 210); }
      else {
        el.classList.add('pop');
        fxBurst(p.r, p.c, p.tile.kind === 'b' ? COLOR_HEX[p.tile.color] : p.tile.kind === 'crate' ? '#c98a4b' : p.tile.kind === 'ash' ? '#b9b4c4' : p.tile.kind === 'ember' ? '#ff7a1a' : '#ffcf3f', p.tile.kind === 'b' ? 7 : 9);
        setTimeout(() => el.remove(), 230);
      }
    }, delay);
  }
  for (const u of step.unlocked || []) {
    const el = els.get(u.tile.id);
    if (el) { el.classList.remove('locked'); flash(el, 'born', 440); }
    fxBurst(u.r, u.c, '#8c93ad', 10); fxRing(u.r, u.c, '#ffffff', cell * 0.8, 0.35, 4);
  }
  for (const u of step.cracked || []) {
    const el = els.get(u.tile.id);
    if (el) { el.firstChild.className = tileClass(u.tile); flash(el, 'nope', 260); }
    fxBurst(u.r, u.c, '#b8f0ff', 8);
  }
  if ((step.unlocked || []).length || (step.cracked || []).length) beep(1300, 0.12, 'triangle', 0.08, 0.6);
  renderHud(step.goals);
  addScore(step.score, step.at[0], step.at[1], step.mult > 1 || step.score >= 500);
  if (game.boss && step.damage > 0) {
    flash($('#doomie'), 'hit', 320);
    const d = document.createElement('span');
    d.className = 'dmg';
    d.textContent = '-' + step.damage;
    $('#boss').appendChild(d);
    setTimeout(() => d.remove(), 820);
  }
  await wait(220 + maxDelay);
  // 3) yeni özel taşlar
  for (const s of step.created) {
    const el = makeEl(s.tile);
    place(el, s.r, s.c);
    el.classList.remove('now');
    flash(el, 'born', 440);
    fxRing(s.r, s.c, '#ffcf3f', cell * 1.3, 0.6, 6); fxStars(s.r, s.c, '#ffe94d', 10);
  }
  if (step.created.length) beep(880, 0.25, 'triangle', 0.12, 1.5);
  // 4) düşüş
  for (const s of step.spawned) { const el = makeEl(s.tile); place(el, s.from, s.c); }
  void board.offsetWidth;
  let longest = 0;
  const moved = [];
  for (const item of step.layout) {
    const el = els.get(item.tile.id);
    if (!el || (el._r === item.r && el._c === item.c)) continue;
    longest = Math.max(longest, fall(el, item.r, item.c, 0));
    moved.push(el);
  }
  // en alta inen yavru kediler kurtarılır: kalp saçıp yukarı uçar
  for (const p of step.rescued || []) {
    const el = els.get(p.tile.id);
    els.delete(p.tile.id);
    if (!el) continue;
    const t = fall(el, p.r, p.c, 0);
    longest = Math.max(longest, t + 650);
    setTimeout(() => {
      el.classList.add('saved');
      fxText(p.r - 0.3, p.c, '♥', '#ff4f8b', cell * 0.7, 0.9); fxStars(p.r, p.c, '#ff7ac8', 10);
      meow();
      setTimeout(() => el.remove(), 650);
    }, t);
  }
  if ((step.rescued || []).length) say(step.rescued.length > 1 ? step.rescued.length + ' yavru kurtuldu!' : 'Bir yavru kurtuldu!', true);
  await wait(longest + 150);
  moved.forEach(resetMotion);
}

/** Tahtayı verilen duruma getirir: yeni taşlar belirir, kaybolanlar patlar, yeri değişenler kayar. */
function syncTo(layout) {
  const keep = new Set();
  let longest = 0;
  for (const item of layout) {
    keep.add(item.tile.id);
    let el = els.get(item.tile.id);
    if (!el) {
      el = makeEl(item.tile);
      place(el, item.r, item.c);
      el.classList.remove('now');
      flash(el, 'born', 440);
    } else if (el._r !== item.r || el._c !== item.c) {
      longest = Math.max(longest, fall(el, item.r, item.c, 0));
    }
    if (item.tile.kind === 'ember') el.firstChild.dataset.fuse = item.tile.fuse;
  }
  for (const [id, el] of els) {
    if (keep.has(id)) continue;
    els.delete(id);
    el.classList.add('pop');
    setTimeout(() => el.remove(), 230);
  }
  return longest;
}

/** Patronun sırası: olayları duyurur, tahtayı günceller, doğan zincirleri oynatır. */
async function playBoss(bt) {
  const msgs = [];
  let attack = false, quake = false;
  for (const ev of bt.events) {
    if (ev.type === 'burn') { msgs.push('Kor yandı: 1 hamle gitti'); fxBurst(ev.r, ev.c, '#ff7a1a', 12); }
    else if (ev.type === 'recede') msgs.push('Su lavı geri itti');
    else if (ev.type === 'rage') { msgs.push('Doomie öfkelendi: kaya yağıyor'); quake = true; attack = true; }
    else if (ev.type === 'lava') { msgs.push('Lav yükseldi'); quake = true; }
    else if (ev.type === 'ember') { msgs.push('Kor: ' + EMBER_FUSE + ' hamlede söndür'); attack = true; }
    else if (ev.type === 'ash') { msgs.push('Kül yağdı'); attack = true; }
    else if (ev.type === 'quake') { msgs.push(game.boss.doom ? 'Deprem: bir sıra kaydı' : game.boss.name + ' bir sırayı kaydırdı'); quake = true; attack = true; }
    else if (ev.type === 'freeze') { msgs.push(game.boss.name + ' balonları dondurdu'); attack = true; for (const [r, c] of ev.cells) fxBurst(r, c, '#b8f0ff', 10); }
    else if (ev.type === 'lock') { msgs.push(game.boss.name + ' zincir vurdu'); attack = true; for (const [r, c] of ev.cells) fxBurst(r, c, '#c9ccd8', 8); }
    else if (ev.type === 'crate') { msgs.push(game.boss.name + ' sandık attı'); attack = true; quake = true; for (const [r, c] of ev.cells) fxBurst(r, c, '#c9a36a', 10); }
    else if (ev.type === 'mix') { msgs.push(game.boss.name + ' balonları boyadı'); attack = true; for (const [r, c] of ev.cells) fxBurst(r, c, COLOR_HEX[game.boss.resist], 10); }
  }
  if (!game.boss.doom) for (const ev of bt.events) if (ev.type === 'rage') { msgs.splice(msgs.indexOf('Doomie öfkelendi: kaya yağıyor'), 1, game.boss.name + ' öfkelendi: daha sık saldıracak'); }
  if (bt.events.length) {
    if (attack) { flash($('#doomie'), 'atk', 460); beep(140, 0.4, 'sawtooth', 0.14, 0.5); }
    if (quake && !reduced) { flash(board, 'shake', 340); buzz(60); }
    say(msgs.join(' · '));
    const longest = syncTo(bt.layout);
    // boyanan ya da zincirlenen taşlar yerinde değişir
    for (const it of bt.layout) {
      const el = els.get(it.tile.id);
      if (!el) continue;
      const cls = tileClass(it.tile);
      if (el.firstChild.className !== cls) { el.firstChild.className = cls; flash(el, 'born', 440); }
      if (!!it.tile.lock !== el.classList.contains('locked')) { el.classList.toggle('locked', !!it.tile.lock); flash(el, 'born', 440); }
    }
    await wait(Math.max(longest, 320) + 160);
    els.forEach(resetMotion);
  }
  let n = 0;
  for (const step of bt.steps) await playStep(step, ++n);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = game.grid[r][c], el = t && els.get(t.id);
    if (el && t.kind === 'ember') el.firstChild.dataset.fuse = t.fuse;
  }
  $('#moves').textContent = game.moves;
}

function edStore() { try { localStorage.setItem('balon-editor', JSON.stringify(ed)); } catch (e) { /* yok say */ } }
function edLevel() { return { name: 'Editör', sign: '', planet: '', glyph: '✎', colors: ed.colors, moves: ed.moves, layout: ed.layout.slice(), goals: ed.goals.map(g => ({ ...g })) }; }
function edCellHtml(ch) {

function renderEditor() {

function edPaintAt(ev) {
  const cellEl = ev.target.closest && ev.target.closest('.ed-cell');
  if (!cellEl) return;
  const r = +cellEl.dataset.r, c = +cellEl.dataset.c;
  if (ed.layout[r][c] === edTool) return;

  ed.layout[r] = ed.layout[r].slice(0, c) + edTool + ed.layout[r].slice(c + 1);
  cellEl.innerHTML = edCellHtml(edTool);
  edStore();
}
/** Hedefleri yerleşimden doldurur: sandık, buz, zincir, yavru sayıları. */
function edAutoGoals() {
  const flat = ed.layout.join('');
  const keep = ed.goals.filter(g => g.type === 'color');
  for (const [ch, type] of [['K', 'kitten'], ['L', 'lock'], ['I', 'ice'], ['C', 'crate']]) { const n = flat.split(ch).length - 1; if (n) keep.unshift({ type, n }); }
  ed.goals = keep.length ? keep : [{ type: 'color', color: 0, n: 20 }];
  renderEditor();
}
function edCheck() {
  if (!ed.goals.length) return 'En az bir hedef ekle.';
  const flat = ed.layout.join('');
  for (const [ch, type, name] of [['C', 'crate', 'sandık'], ['I', 'ice', 'buz'], ['L', 'lock', 'zincir'], ['K', 'kitten', 'yavru']]) {
    const have = flat.split(ch).length - 1, goal = ed.goals.find(g => g.type === type);
    if (goal && goal.n > have && type !== 'crate') return 'Hedefte ' + goal.n + ' ' + name + ' var ama tahtada ' + have + ' tane var.';
    if (goal && goal.n > have && type === 'crate') return 'Hedefte ' + goal.n + ' sandık var ama tahtada ' + have + ' tane var.';
  }
  return '';
}
function openEditor() {
  if (!ed) ed = edLoad();

  document.body.classList.remove('doom');
  $('#end').classList.remove('on');

async function edMeasure() {
  const err = edCheck();
  if (err) { $('#edStatus').textContent = err; return; }
  if (edTesting) return;
  edTesting = true;
  const lv = edLevel(), N = 30;
  let won = 0, stars = 0;
  for (let k = 0; k < N; k++) {
    const r = simulate(lv, 1);
    won += r.win; stars += r.stars * r.win;
    $('#edStatus').textContent = 'Otomatik oyuncu oynuyor: ' + (k + 1) + ' / ' + N;
    await new Promise(res => setTimeout(res, 0));
  }
  edTesting = false;
  const pct = Math.round(won / N * 100);
  $('#edStatus').textContent = 'Otomatik oyuncu ' + N + ' oyunun ' + won + '\'ini kazandı (%' + pct + ')' + (won ? ', ortalama ' + (stars / won).toFixed(1) + ' yıldız' : '') + '. ' + (pct >= 90 ? 'Çok kolay: hamleyi azalt.' : pct >= 60 ? 'İyi bir ara.' : pct >= 35 ? 'Zor: son duraklar için uygun.' : 'Çok zor: hamleyi artır.');
}
function edExport() {

    ed = { colors: Math.max(3, Math.min(6, v.colors | 0 || 5)), moves: Math.max(5, Math.min(60, v.moves | 0 || 20)), layout: v.layout, goals: v.goals };

    ex.innerHTML = '+' + EXTRA_MOVES + ' hamle ile devam et<small>' + cost + ' yıldız harca · elinde ' + have + ' ★' + (have < cost ? ' (yetmiyor)' : '') + '</small>';
  }

  const end = $('#end');

// ---- geliştirici düğmeleri
// Yönetici modu: açınca asıl kayıt saklanır, bütün duraklar/kediler açılır, 300 elmas gelir.
// Kapatınca asıl kayıt geri yüklenir (yönetici modundaki ilerleme silinir).
// Sıfırla: kayıt (ve varsa yönetici yedeği) bir kenara konur, oyun baştan başlar; tekrar basınca eski kayıt geri gelir.
const ADMIN_KEY = KEY + '-admin-yedek', RESET_KEY = KEY + '-sifir-yedek';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* yok say */ } }
function reloadSave() {
  const muted = save.muted;
  save = freshSave();
  loadSave();
  save.muted = muted;
  storeSave();
  $('#edOpen').hidden = !save.dev;
  showMap(0);
  renderDevBar();
}
function renderDevBar() {
  const adm = lsGet(ADMIN_KEY) !== null, rst = lsGet(RESET_KEY) !== null;
  $('#devAdmin').textContent = adm ? 'Yönetici: AÇIK' : 'Yönetici: kapalı';
  $('#devAdmin').classList.toggle('on', adm);
  $('#devReset').textContent = rst ? 'Eski kaydı geri getir' : 'Sıfırla';
  $('#devReset').classList.toggle('on', rst);
}
function initDevBar() {
  renderDevBar();
  $('#devAdmin').addEventListener('click', () => {
    const backup = lsGet(ADMIN_KEY);
    if (backup === null) {
      lsSet(ADMIN_KEY, JSON.stringify(save));
      save.stars = save.stars.map(v => Math.max(v, 1));
      save.diamonds += 300;
      for (const k in CATS) { giveCat(k); save.demo[k] = true; }
      save.wheel = ''; save.dev = true;
      storeSave();
      meow();
    } else {
      lsSet(KEY, backup);
      lsSet(ADMIN_KEY, null);
    }
    reloadSave();
  });
  let armed = 0;
  $('#devReset').addEventListener('click', () => {
    const backup = lsGet(RESET_KEY);
    if (backup === null) {
      // yanlışlıkla basılmasın: ilk dokunuş onay ister
      if (Date.now() - armed > 3000) { armed = Date.now(); $('#devReset').textContent = 'Emin misin? Tekrar bas'; setTimeout(renderDevBar, 3000); return; }
      armed = 0;
      lsSet(RESET_KEY, JSON.stringify({ save: lsGet(KEY) || JSON.stringify(save), admin: lsGet(ADMIN_KEY) }));
      lsSet(KEY, JSON.stringify(Object.assign(freshSave(), { muted: save.muted })));
      lsSet(ADMIN_KEY, null);
    } else {
      try {
        const b = JSON.parse(backup);
        lsSet(KEY, b.save);
        lsSet(ADMIN_KEY, b.admin);
      } catch (e) { /* bozuk yedek */ }
      lsSet(RESET_KEY, null);
    }
    reloadSave();
  });
}

function start(data) {
  loadSave();
  if (data && data.save && Array.isArray(data.save.stars) && data.save.stars.length === LEVELS.length && data.save.cats) save = data.save;
  $('#muteBtn').textContent = save.muted ? '×' : '♪';
  buildCats();
  showMap();
  $('#diaBtn').addEventListener('click', openShop);
  $('#coach').addEventListener('click', openShop);
  initEditor();
  $('#skipBtn').addEventListener('click', () => { skipFinale = true; $('#skipBtn').hidden = true; });
  $('#endExtra').addEventListener('click', buyExtraMoves);
  $('#edOpen').addEventListener('click', openEditor);
  $('#edOpen').hidden = !save.dev;
  $('#wheelFab').addEventListener('click', openWheel);
  $('#wheelSpin').addEventListener('click', doSpin);
  $('#wheelClose').addEventListener('click', () => { if (!wheelBusy) $('#wheel').classList.remove('on'); });
  $('#wheel').addEventListener('click', ev => { if (ev.target.id === 'wheel' && !wheelBusy) $('#wheel').classList.remove('on'); });
  $('#shopClose').addEventListener('click', () => $('#shop').classList.remove('on'));
  $('#shop').addEventListener('click', ev => { if (ev.target.id === 'shop') $('#shop').classList.remove('on'); });
  // yönetici modu ve sıfırlama (şimdilik herkese açık geliştirici düğmeleri)
  initDevBar();
  board.addEventListener('pointerdown', onDown);
  board.addEventListener('pointermove', onMove);
  board.addEventListener('pointerup', onUp);
  board.addEventListener('pointercancel', () => { drag = null; });
  $('#backBtn').addEventListener('click', () => (testMode ? openEditor() : showMap(levelIndex)));
  $('#endMap').addEventListener('click', () => (testMode ? openEditor() : showMap(levelIndex)));
  $('#lvClose').addEventListener('click', () => $('#level').classList.remove('on'));
  $('#level').addEventListener('click', ev => { if (ev.target.id === 'level') $('#level').classList.remove('on'); });
  $('#muteBtn').addEventListener('click', () => {
    save.muted = !save.muted;
    storeSave();
    $('#muteBtn').textContent = save.muted ? '×' : '♪';
    if (!save.muted) beep(660, 0.1);
  });
  window.addEventListener('resize', resize);
}

if (typeof window !== 'undefined') {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ save }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
}
</script>
</body>
</html>
